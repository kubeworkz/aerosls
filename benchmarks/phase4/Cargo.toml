[package]
name = "aerosls-phase4-bench"
version = "0.1.0"
edition = "2021"
description = "Phase 4 Device Driver SDK micro-benchmarks for AeroSLS"

[dependencies]
aerosls-proto = { path = "../../user/proto" }
aerosls-kernel-sim = { path = "../../user/kernel-sim" }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "irq_latency"
harness = false

[[bench]]
name = "dma_alloc"
harness = false

[[bench]]
name = "channel_throughput"
harness = false

[[bench]]
name = "nic_throughput"
harness = false

[[bin]]
name = "bench-report"
path = "src/main.rs"

[profile.bench]
opt-level = 3
lto = "thin"
