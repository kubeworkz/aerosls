name: CI

# Operational Phase A (docs/AeroSLS-Operational-MVP-Roadmap-v0.1.md).
#
# Runs the same two verification steps that have been done by hand,
# manually, at the end of every phase of every roadmap doc in docs/ this
# whole project's history: the host test suite, and a gcc -fsyntax-only
# sweep of every kernel source file using the Makefile's own real cross-
# build flags (no x86_64-elf-gcc cross-compiler available here, matching
# every prior manual verification pass -- see tools/syntax_check_all.sh's
# own header comment). Nothing new is invented here; this just makes those
# two known-good commands run automatically instead of relying on a person
# remembering to run them before merging.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host test suite (tests/*_host_test.c)
        run: bash tests/run_all.sh

      - name: Kernel syntax check (gcc -fsyntax-only, X86_C_SRC)
        run: bash tools/syntax_check_all.sh

      # ─── The *_check.sh guards ──────────────────────────────────────────
      # These were run by nothing until now: run_all.sh globs *_host_test.c,
      # and these are shell scripts, so the guards sat in tests/ passing
      # review and inspecting nothing. Each was written after the bug it
      # catches had already cost a diagnostic round.
      #
      # Three of the six (makefile_sources, commands_doc,
      # script_conventions) read only sources and run here. The other three
      # need a linked kernel or its objects, and this runner has no
      # x86_64-elf-gcc -- see the note at the top of this file -- so they
      # exit 2 and are reported as SKIP with the reason printed. A skip is
      # counted separately and never mistaken for a pass; read the step's
      # output rather than just its green tick.
      #
      # Use --require-all on a build host, where the prerequisites must
      # exist and "could not check" must not resemble "it is fine".
      - name: Guard scripts (tests/*_check.sh)
        run: bash tests/run_checks.sh

      # The step above proves the guards pass; the smokes prove they can
      # fail. Each *_smoke.sh deliberately breaks one guard's input and
      # asserts the guard exits 1 and names the violation — so a
      # regression that made a guard blind fails CI instead of sailing
      # through green. All three source-only guards have a smoke now:
      # script_conventions (index teeth: mode, shebang, CRLF),
      # makefile_sources (an unbuilt .c and a stale list entry),
      # commands_doc (the hex-vs-data field bug). They are *smoke.sh*,
      # not *_check.sh, so run_checks.sh and deploy.sh's guard gate never
      # run them.
      - name: Script-conventions guard teeth (smoke)
        run: bash tests/script_conventions_smoke.sh

      - name: Makefile-sources guard teeth (smoke)
        run: bash tests/makefile_sources_smoke.sh

      - name: Commands-doc guard teeth (smoke)
        run: bash tests/commands_doc_smoke.sh
