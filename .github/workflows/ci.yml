name: CI

# Operational Phase A (docs/AeroSLS-Operational-MVP-Roadmap-v0.1.md).
#
# Runs the same two verification steps that have been done by hand,
# manually, at the end of every phase of every roadmap doc in docs/ this
# whole project's history: the host test suite, and a gcc -fsyntax-only
# sweep of every kernel source file using the Makefile's own real cross-
# build flags (no x86_64-elf-gcc cross-compiler available here, matching
# every prior manual verification pass -- see tools/syntax_check_all.sh's
# own header comment). Nothing new is invented here; this just makes those
# two known-good commands run automatically instead of relying on a person
# remembering to run them before merging.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# --- CI ROUTING: SELF-HOSTED (dated exception -- see 0b of
# docs/AeroSLS-QEMU-SLS-Claim-Verification-v0.1.md) ------------------------
# All five jobs run on the self-hosted WSL runner (sls-wsl-runner) because
# GitHub's hosted-runner fleet failed to attach runners on 2026-08-17
# (runner_id=0 on every job). This is a deliberate, recorded exception:
# tests/selfhosted_routing_smoke.sh fails unless the runs-on below and the
# CI-ROUTING marker in the doc agree. Reverting these lines to
# ubuntu-latest REQUIRES flipping that marker to HOSTED in the same commit
# -- the two-way lock is the point, so the routing can't stay self-hosted
# by accident after the fleet recovers.

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: aerosls2

      # The host suite's sls_alloc_host_test.c greps the REAL
      # qemu/sls/sls-runtime.c to prove its extracted allocator copy has
      # not diverged from the shipped source (see the last check in its
      # main()). run_all.sh runs from the repo root, so the sibling must
      # be at ../qemu relative to it. Without this checkout that one
      # check failed in CI while passing on any machine that happened to
      # have a qemu sibling -- a machine-dependent pass. Same guard as
      # the kernel-needing jobs: qemu-sls is private, so it needs
      # QEMU_SLS_PAT.
      - name: Guard the qemu-sls checkout (private repo requires QEMU_SLS_PAT)
        env:
          QEMU_SLS_PAT: ${{ secrets.QEMU_SLS_PAT }}
        run: |
          set -u
          # Probe helper: echo the HTTP code for a URL, with the PAT as a
          # Bearer when one is set. `|| echo 000` keeps a curl failure
          # (network, DNS, TLS) from aborting under bash -e with zero
          # output; 000 means "no response" and every caller checks for it.
          probe() {
            if [ -n "$2" ]; then
              curl -sL --max-time 15 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $2" "$1" || echo 000
            else
              curl -sL --max-time 15 -o /dev/null -w '%{http_code}' "$1" || echo 000
            fi
          }
          if [ -n "${QEMU_SLS_PAT:-}" ]; then
            # Secret set: validate it actually covers the repo BEFORE the
            # checkout, so a mis-configured token fails here with the
            # cause instead of burning retries on a raw git 403. Probe 1
            # = repo metadata (GET /repos/...): needs only Metadata: Read
            # on the repo. Probe 2 = the root contents listing (GET
            # /repos/.../contents/): needs Contents: Read -- the
            # permission git smart-HTTP actually uses. The failure modes
            # map one-to-one:
            #   401          -> the secret holds an invalid/expired token
            #                  (stale or truncated value -- re-paste the
            #                  current token from the PAT edit page)
            #   403/404 on 1 -> token authenticates but is not granted
            #                  this repo (wrong repo selected, wrong
            #                  owner account, or the org never approved
            #                  the fine-grained token)
            #   200 then 403 -> metadata-only token: Contents: Read
            #                  missing. Invisible to the anonymous probe
            #                  and to the API repo endpoint (curl says
            #                  200, git says 403) -- the exact failure
            #                  that took three CI cycles to find.
            meta=$(probe https://api.github.com/repos/kubeworkz/qemu-sls "$QEMU_SLS_PAT")
            case "$meta" in
              000*)
                echo "::error::could not reach api.github.com to validate QEMU_SLS_PAT (HTTP $meta) --"
                echo "::error::retry the run; CI cannot verify the checkout without the probe."
                exit 1 ;;
              200) ;;
              401)
                echo "::error::QEMU_SLS_PAT is set but GitHub rejects it as a credential (HTTP 401) --"
                echo "::error::the secret likely holds a stale, truncated, or revoked token value;"
                echo "::error::copy the current token from the fine-grained PAT edit page and re-save"
                echo "::error::the QEMU_SLS_PAT secret with it."
                exit 1 ;;
              403|404)
                echo "::error::QEMU_SLS_PAT is set but GitHub denies it on kubeworkz/qemu-sls (HTTP $meta)."
                echo "::error::The token authenticates but is not granted this repository -- on the"
                echo "::error::fine-grained PAT's edit page check that Repository access includes"
                echo "::error::kubeworkz/qemu-sls, that the token was created in the account that"
                echo "::error::owns/admins the repo, and that any required org approval was granted."
                exit 1 ;;
              *)
                echo "::error::unexpected HTTP $meta probing kubeworkz/qemu-sls with QEMU_SLS_PAT -- retry the run."
                exit 1 ;;
            esac
            contents=$(probe "https://api.github.com/repos/kubeworkz/qemu-sls/contents/" "$QEMU_SLS_PAT")
            case "$contents" in
              200)
                echo "QEMU_SLS_PAT validated on kubeworkz/qemu-sls (metadata + contents read) -- proceeding to the checkout."
                exit 0 ;;
              000*)
                echo "::error::could not reach api.github.com validating QEMU_SLS_PAT contents access (HTTP $contents) -- retry the run."
                exit 1 ;;
              403|404)
                echo "::error::QEMU_SLS_PAT can read the repo's metadata but NOT its contents (HTTP $contents)."
                echo "::error::git clone/fetch needs Contents: Read, not just Metadata. On the fine-grained"
                echo "::error::PAT's edit page for kubeworkz/qemu-sls set Permissions -> Repository"
                echo "::error::permissions -> Contents: Read-only (Metadata: Read is auto-granted)."
                exit 1 ;;
              *)
                echo "::error::unexpected HTTP $contents probing qemu-sls contents with QEMU_SLS_PAT -- retry the run."
                exit 1 ;;
            esac
          fi
          # No secret set: probe the repo anonymously -- a 200 means it
          # went public (no secret needed, checkout works anonymously),
          # anything else means the checkout would fail, so name the fix
          # and stop. -L: the API answers 301 (moved to a repository-ID
          # URL) for public repos; without following it a public repo
          # would be misread as private and the guard would fail wrongly.
          code=$(probe https://api.github.com/repos/kubeworkz/qemu-sls "")
          if [ "$code" = "200" ]; then
            echo "qemu-sls is public -- no secret needed, checkout will work anonymously."
            exit 0
          fi
          # curl writes the -w code once per connection attempt, so a
          # failed probe can be "000" or "000000" -- match the all-zeros
          # family rather than an exact "000".
          case "$code" in
            000*)
              echo "::error::could not reach api.github.com to probe qemu-sls visibility (HTTP $code) --"
              echo "::error::retry the run; CI cannot verify the checkout without the probe."
              exit 1 ;;
          esac
          echo "::error::qemu-sls (kubeworkz/qemu-sls) is PRIVATE but the QEMU_SLS_PAT"
          echo "::error::secret is not configured (anonymous probe returned HTTP $code)."
          echo "::error::The host suite's sls_alloc_host_test reads ../qemu/sls/sls-runtime.c,"
          echo "::error::so verify cannot pass without this checkout. Fix: add a read-access"
          echo "::error::fine-grained PAT for kubeworkz/qemu-sls as the QEMU_SLS_PAT secret at"
          echo "::error::https://github.com/kubeworkz/aerosls/settings/secrets/actions"
          exit 1

      - uses: actions/checkout@v4
        with:
          repository: kubeworkz/qemu-sls
          path: qemu
          token: ${{ secrets.QEMU_SLS_PAT }}
          fetch-depth: 1

      - name: Host test suite (tests/*_host_test.c)
        run: bash tests/run_all.sh
        working-directory: aerosls2

      - name: Kernel syntax check (gcc -fsyntax-only, X86_C_SRC)
        run: bash tools/syntax_check_all.sh
        working-directory: aerosls2

      # ─── The *_check.sh guards ──────────────────────────────────────────
      # These were run by nothing until now: run_all.sh globs *_host_test.c,
      # and these are shell scripts, so the guards sat in tests/ passing
      # review and inspecting nothing. Each was written after the bug it
      # catches had already cost a diagnostic round.
      #
      # Thirteen of the twenty-four read only sources and run here. The six
      # GUARD-KIND: build guards (code_buffer_budget, kernel_image_end,
      # no_hosted_link, no_tls_relocations, stack_frame_budget,
      # tcache_roundtrip) need the
      # linked kernel or its objects, and this runner has no x86_64-elf-gcc
      # -- see the note at the top of this file -- so they are registered
      # skips, reported with the reason printed. A skip is counted
      # separately and never mistaken for a pass; read the step's output
      # rather than just its green tick. Those five are run for real, with
      # their teeth proven, in the kernel-guards job below.
      #
      # A guard that exits 2 WITHOUT the GUARD-KIND: build (or runtime)
      # marker is a FAILURE here, fail-closed: a guard that stops being
      # source-only cannot silently go dark, which is exactly how the M5/M7
      # era rotted (the frontend-off build broke, kernel-guards never
      # reached its guards, and CI stayed green anyway).
      #
      # Use --require-all on a build host, where the prerequisites must
      # exist and "could not check" must not resemble "it is fine".
      - name: Guard scripts (tests/*_check.sh)
        run: bash tests/run_checks.sh
        working-directory: aerosls2

      # The step above proves the guards pass; the smokes prove they can
      # fail. Each *_smoke.sh deliberately breaks one guard's input and
      # asserts the guard exits 1 and names the violation — so a
      # regression that made a guard blind fails CI instead of sailing
      # through green. They are *smoke.sh*, not *_check.sh, so
      # run_checks.sh and deploy.sh's guard gate never run them.
      #
      # run_guard_smokes.sh runs all twenty-four, but five need the linked
      # kernel or its objects, so that runner needs a build host. The
      # other twenty-six are source-only — gcc/binutils/python3/openssl and
      # the sources in the tree, nothing built — so they run HERE, on
      # every push, independent of the kernel build. That independence is
      # the point: tls_cert_oracle_smoke.sh failed at link for months,
      # invisible because the build-host job (kernel-guards) died at its
      # build step before reaching its smokes. run_source_smokes.sh keeps
      # the source-only set green on its own, and fails any smoke that
      # cannot run without being on its build-needed exclusion list.
      - name: Source-only guard teeth (all 26 smokes that need no build)
        run: bash tests/run_source_smokes.sh
        working-directory: aerosls2

      # ─── Rust toolchain for the AeroIDL gate ───────────────────────────
      # The aeroidl-check gate below needs cargo. This runner is
      # self-hosted, so the toolchain may or may not be pre-installed;
      # probe for it rather than assuming either way. rustup is the
      # standard installer for a modern glibc Linux toolchain (the
      # distro's rustc is routinely years old and can lag Cargo's
      # edition/resolver features); it is idempotent, so a runner that
      # already has it is untouched. `~/.cargo/bin` is added to
      # GITHUB_PATH so later steps see cargo even though rustup installs
      # outside the job's initial PATH. No third-party action: the rest
      # of this file uses only actions/checkout, and the fallback logic
      # is two lines.
      - name: Ensure the Rust toolchain (cargo for aeroidl-check)
        run: |
          set -e
          if command -v cargo >/dev/null 2>&1; then
            echo "cargo already available: $(cargo --version)"
            exit 0
          fi
          if command -v rustup >/dev/null 2>&1; then
            rustup update stable
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version

      # Print the active toolchain and rustc version so a toolchain
      # mismatch between CI runs is diagnosable from logs alone, without
      # needing to match the runner's local filesystem.
      - name: Print active Rust toolchain (diagnostics)
        run: rustup show

      # ─── AeroIDL codegen gate (the Polyglot Nexus) ─────────────────────
      # Every .aeroidl file under idl/ must parse, type-check, and generate
      # all four backends (Rust client, Rust dispatcher, Common Lisp, C
      # header) such that the generated code COMPILES: cargo check on the
      # Rust pair, gcc/clang on the C header, paren-balance on the Lisp.
      # This is the same gate as `make aeroidl-check`. It catches codegen
      # regressions that unit tests cannot: a generator change that emits
      # unbalanced Lisp parens, a missing C count parameter, or an enum/
      # arena type mismatch in the Rust dispatcher all fail here with exit
      # 1. Requires the Rust toolchain; the self-hosted runner has gcc, so
      # the C header is really compiled rather than skipped.
      - name: AeroIDL codegen gate (all 4 backends compile for every IDL)
        run: make aeroidl-check
        working-directory: aerosls2

      # ─── AeroIDL cross-language constant consistency ───────────────────
      # tools/aeroidl/tests/cross_lang_constants.rs greps every channel-flag
      # and capability-permission constant across the kernel, C SDK, Rust
      # runtime, mocks, and generated backends and fails if any disagrees
      # with kernel/cap.h (the source of truth). It also runs inside
      # `make aeroidl-check` above (via the aeroidl-consistency target, so
      # it is part of the gate); this step surfaces it as its own named
      # check so drift — like the CHAN_FLAG_NO_REPLY 0x0002 -> 0x0001 fix —
      # is diagnosable from the log on every push instead of being buried
      # in the test-suite output.
      - name: AeroIDL cross-language constant consistency
        run: make aeroidl-consistency
        working-directory: aerosls2

      # ─── AeroIDL gate teeth ────────────────────────────────────────────
      # The step above proves the gate passes; this proves it can fail.
      # tests/aeroidl_gate_smoke.sh breaks each of the four generators one
      # at a time (Rust client, Rust dispatcher, Lisp, C header) and
      # requires the gate to fail on each, then restores the files
      # byte-identically and requires the gate to pass again — so a
      # regression that made the gate blind fails CI instead of sailing
      # through green. Runs here because this job already has the Rust
      # toolchain and gcc, so all four teeth (including the C one) bite.
      - name: AeroIDL gate teeth (every generator must be able to fail the gate)
        run: bash tests/aeroidl_gate_smoke.sh
        working-directory: aerosls2

      # ─── AeroSLS crate: no_std target build (compile-time ABI gate) ────
      # user/aerosls embeds the compile-time ABI const asserts (req.rs:
      # size_of!/align_of!/offset_of! on every wire struct) into EVERY
      # build, so a layout drift fails `cargo build` itself — not just the
      # tests. The `target` feature is the no_std path sidecar images ship
      # with, so building it here proves both the compile-time ABI gate and
      # the no_std compile on every push. Reuses the toolchain installed
      # above; `-p aerosls` builds only that member (it has no deps), so
      # unrelated workspace members never come into play.
      - name: AeroSLS target build (no_std compile-time ABI gate)
        run: cargo build -p aerosls --features target --manifest-path user/Cargo.toml
        working-directory: aerosls2

  polyglot-e2e:
    # actions: write is needed for upload-artifact (the bench archive) and
    # for listing/downloading the previous run's artifact (drift baseline).
    permissions:
      contents: read
      actions: write

    # The Polyglot Nexus two-process e2e: sls-kerneld (arena + channel
    # queues over TCP) + the wasmi-embedded Wasm sidecar + a real SBCL Lisp
    # sidecar, all on one channel with a large byte array travelling through
    # the shared arena by MEM cap (never across the wire) over syscalls
    # 302-304. The sidecar binaries use Linux-only APIs (mmap, as_raw_fd),
    # so this job is Linux-only and provisions both prerequisites here —
    # the e2e test then runs natively (no WSL on this runner) instead of
    # skipping. Same self-hosted runner and checkout layout as `verify`.
    runs-on: [self-hosted, Linux, X64]
    env:
      # The e2e test probes POLYGLOT_TARGET_DIR for the release bins;
      # CARGO_TARGET_DIR must point at the same directory so the build and
      # the probe agree (default matches the test's own fallback).
      POLYGLOT_TARGET_DIR: /tmp/polyglot-target
    steps:
      - uses: actions/checkout@v4
        with:
          path: aerosls2

      # Same probe as the verify job: the self-hosted runner may or may not
      # have cargo; rustup is idempotent and installs a modern toolchain.
      # No third-party action — same two-line fallback as `verify`.
      - name: Ensure the Rust toolchain (cargo for the polyglot build)
        run: |
          set -e
          if command -v cargo >/dev/null 2>&1; then
            echo "cargo already available: $(cargo --version)"
            exit 0
          fi
          if command -v rustup >/dev/null 2>&1; then
            rustup update stable
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version

      # The Lisp sidecar is a real SBCL image; install it when the runner
      # lacks it (apt-get is idempotent, matching the kernel-build jobs
      # below). This is what lets the e2e run here instead of skipping on
      # "no sbcl reachable".
      - name: Ensure SBCL (Lisp sidecar runtime)
        run: |
          set -e
          if command -v sbcl >/dev/null 2>&1; then
            echo "sbcl already available: $(sbcl --version)"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y sbcl
          sbcl --version

      # The sidecar binaries are gated behind the `linux` feature; build
      # them into POLYGLOT_TARGET_DIR (via CARGO_TARGET_DIR) so the e2e
      # test's bin probe finds them.
      - name: Build the polyglot sidecar binaries (Linux)
        run: |
          set -e
          export CARGO_TARGET_DIR="$POLYGLOT_TARGET_DIR"
          cargo build -p polyglot --release --features linux --manifest-path user/Cargo.toml
          test -x "$POLYGLOT_TARGET_DIR/release/sls-kerneld"
          test -x "$POLYGLOT_TARGET_DIR/release/wasm-sidecar"
        working-directory: aerosls2

      # Run the real two-process e2e natively. The test skips (prints SKIP:
      # and still passes) only when the bins or sbcl are missing — both are
      # provisioned above, so treat any SKIP as a hard failure: the e2e
      # must actually run on every push, not silently skip. The test also
      # enforces a latency regression gate: either bench leg's median round
      # trip must stay under POLYGLOT_BENCH_MEDIAN_NS (default 5ms; measured
      # medians are ~0.6ms add / ~1.5ms sqrt), failing the build if it blows
      # past the threshold.
      - name: Run the two-process wasm-lisp e2e (real transport)
        env:
          # ns; 5ms catches an order-of-magnitude transport regression with
          # wide headroom over the ~0.6-1.5ms measured medians.
          POLYGLOT_BENCH_MEDIAN_NS: 5000000
        run: |
          set -e
          out="$(cargo test -p polyglot --test e2e_two_process --manifest-path user/Cargo.toml -- --nocapture 2>&1)"
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q 'SKIP:'; then
            echo "::error::polyglot e2e skipped (missing prerequisite); it must run on this job"
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'test result: ok' || {
            echo "::error::polyglot e2e did not pass"; exit 1; }
          # Archive the per-leg bench JSON (one BENCH_JSON line per leg, from
          # the wasm-sidecar) for latency drift tracking. Missing JSON means
          # the bench emission is broken — fail loudly.
          printf '%s\n' "$out" | grep 'BENCH_JSON' > bench-polyglot.jsonl || true
          if [ ! -s bench-polyglot.jsonl ]; then
            echo "::error::no BENCH_JSON lines from the e2e — bench emission is broken"
            exit 1
          fi
        working-directory: aerosls2

      # Persist the latency numbers from the step above as an artifact, so
      # each run's per-leg medians/p99s can be compared over time (the
      # wasm-sidecar emits one BENCH_JSON line per bench leg).
      - name: Archive bench latency results
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-bench-latency
          path: aerosls2/bench-polyglot.jsonl
          if-no-files-found: error

      # Soft drift baseline: fetch the NEWEST completed-run artifact of the
      # same name, excluding the artifact this run is about to produce (the
      # archive step above just uploaded it) and any in-progress run. Pure
      # advisory — if the API is unreachable, auth is missing, or this is
      # the first run, skip gracefully (the drift step below then has no
      # baseline and prints a notice instead of comparing).
      - name: Download previous bench baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          api="https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=polyglot-bench-latency&per_page=10"
          list="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" || true)"
          if [ -z "$list" ]; then
            echo "no previous artifact list (API unreachable / no auth) — skipping drift check"
            exit 0
          fi
          id="$(printf '%s' "$list" | GH_RUN_ID="$GITHUB_RUN_ID" python3 -c '
          import json, os, sys
          run = os.environ.get("GH_RUN_ID", "")
          for a in json.load(sys.stdin).get("artifacts", []):
              wr = a.get("workflow_run") or {}
              if str(wr.get("id", "")) == run:
                  continue
              if wr.get("status") != "completed":
                  continue
              print(a["id"])
              break
          ')"
          if [ -z "$id" ]; then
            echo "no previous completed-run artifact — first run (or API permission missing)"
            exit 0
          fi
          echo "previous artifact id=$id"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip" \
            -o previous-bench.zip
          GH_FILE=previous-bench.zip python3 -c '
          import os, zipfile
          zipfile.ZipFile(os.environ["GH_FILE"]).extractall("previous-bench")
          '
          # The uploaded artifact preserves the checkout-relative path (e.g.
          # aerosls2/bench-polyglot.jsonl); normalize to a flat location so
          # the drift step can read it without knowing that structure.
          found="$(find previous-bench -name bench-polyglot.jsonl | head -1)"
          if [ -z "$found" ]; then
            echo "previous artifact has no bench-polyglot.jsonl — skipping drift check"
            exit 0
          fi
          cp "$found" previous-bench/bench-polyglot.jsonl
          echo "baseline ready: previous-bench/bench-polyglot.jsonl"
        working-directory: aerosls2

      # Soft drift warning: compare each leg's median — AND its
      # compute/transport split — against the previous run's baseline and
      # emit a ::warning:: annotation when a component grew >= 2x. A split
      # inversion (e.g. transport ballooning while total stays flat, or
      # Lisp-side work silently getting slower) is caught here even when
      # the total median hides it. Advisory only, never fails the build:
      # the hard 5ms gate in the e2e step is the actual failure boundary;
      # this surfaces drift well before that, so a slow 2-4x regression
      # shows up as a warning even while still under the threshold.
      - name: Warn on latency drift vs previous baseline (soft)
        run: |
          set -e
          if [ ! -f previous-bench/bench-polyglot.jsonl ]; then
            echo "no previous baseline — nothing to compare (first run)"
            exit 0
          fi
          # Single source of truth for the drift logic: tests/polyglot_drift_check.py
          # (also invoked by the gate-teeth smoke, so a warning the teeth prove is
          # the exact warning this step emits). Advisory — exits 0 either way.
          python3 tests/polyglot_drift_check.py \
            bench-polyglot.jsonl previous-bench/bench-polyglot.jsonl
        working-directory: aerosls2

      # ─── Polyglot latency gate teeth ───────────────────────────────────
      # The step above proves the gate passes; this proves it can fail.
      # tests/polyglot_latency_gate_smoke.sh reverts the two transport
      # fixes that cured the original Nagle/delayed-ACK stall (single-write
      # frames + TCP_NODELAY on kerneld) and requires the e2e latency gate
      # to FAIL with the regression in place, then restores the sources
      # byte-identically and requires the gate to PASS again — so a change
      # that made the gate blind fails CI instead of sailing through green.
      # The mutated run takes ~1min (each round trip inflates to ~40-50ms),
      # which is why this lives in this job and not in the default gate.
      - name: Polyglot latency gate teeth (a transport regression must fail the e2e)
        run: bash tests/polyglot_latency_gate_smoke.sh
        working-directory: aerosls2

  kernel-guards:
    # The five kernel-needing guards (stack_frame_budget, kernel_image_end,
    # no_tls_relocations, no_hosted_link, code_buffer_budget) need the
    # linked kernel and its objects, so they skip in `verify` and were
    # proven only on a build host. code_buffer_budget asserts the two
    # translation-cache buffers link at their declared sizes (32 MiB /
    # 4 MiB, read from the sources) and stay distinct. no_hosted_link is
    # the machine-checked form of the core
    # no-glibc/no-user-space property: the linked image must have zero
    # undefined symbols, no dynamic section, and no ELF interpreter -- a
    # hosted leak (-lc in the link, a hosted object linked in, a weak
    # undefined resolved to 0) fails the gate instead of halting a node at
    # runtime. This job builds the real shipping artifact (the bootable
    # ISO, via make x86-iso -- since M8 the default build is the decoder,
    # SLS_X86_FRONTEND=on, the same frontend deploy.sh ships) and runs
    # the deploy gate's two commands --
    # run_checks.sh --require-all and run_guard_smokes.sh -- so all
    # twenty-four guards pass AND all twenty-four smokes prove their teeth
    # on every push (the five runtime guards -- entropy_boot_diversity,
    # partition_reannounce_live, partition_ownedset_gc_live, failover_adoption,
    # failover_2node -- still report their owed skips: they need a live cluster). Then it
    # boots the
    # ISO under QEMU and checks the service end to end: the kernel's first
    # serial banner must appear, and its webapp must answer /api/health on
    # the forwarded port (the exact endpoint deploy.sh gates on) — proving
    # the webapp serves, not just that the kernel boots. Verified
    # end-to-end on a fresh checkout: the ISO builds, all twenty-four guards
    # + all twenty-four smokes pass, the ISO boots under QEMU, and /api/health
    # answers in ~10s.
    #
    # Toolchain: the cross compiler (x86_64-elf-gcc) is replaced by the
    # host gcc/ld via the X86_CC/X86_LD overrides. The kernel is
    # freestanding x86-64 and the guards themselves compile with plain gcc,
    # so the linked artifacts are equivalent for everything the guards
    # inspect. The Makefile builds only the x86-iso target here -- no
    # plugins (llvm) and no riscv-elf toolchain required.
    #
    # The kernel links 15 objects out of ../qemu, so the sibling repo must
    # be checked out next to aerosls2 (the Makefile's hardcoded ../qemu
    # path). qemu-sls is kubeworkz/qemu-sls: if it is private, set the
    # QEMU_SLS_PAT secret to a token with read access; if public, no secret
    # is needed.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: aerosls2

