name: CI

# Operational Phase A (docs/AeroSLS-Operational-MVP-Roadmap-v0.1.md).
#
# Runs the same two verification steps that have been done by hand,
# manually, at the end of every phase of every roadmap doc in docs/ this
# whole project's history: the host test suite, and a gcc -fsyntax-only
# sweep of every kernel source file using the Makefile's own real cross-
# build flags (no x86_64-elf-gcc cross-compiler available here, matching
# every prior manual verification pass -- see tools/syntax_check_all.sh's
# own header comment). Nothing new is invented here; this just makes those
# two known-good commands run automatically instead of relying on a person
# remembering to run them before merging.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aerosls2

      # The host suite's sls_alloc_host_test.c greps the REAL
      # qemu/sls/sls-runtime.c to prove its extracted allocator copy has
      # not diverged from the shipped source (see the last check in its
      # main()). run_all.sh runs from the repo root, so the sibling must
      # be at ../qemu relative to it. Without this checkout that one
      # check failed in CI while passing on any machine that happened to
      # have a qemu sibling -- a machine-dependent pass. Same guard as
      # the kernel-needing jobs: qemu-sls is private, so it needs
      # QEMU_SLS_PAT.
      - name: Guard the qemu-sls checkout (private repo requires QEMU_SLS_PAT)
        env:
          QEMU_SLS_PAT: ${{ secrets.QEMU_SLS_PAT }}
        run: |
          set -u
          if [ -n "${QEMU_SLS_PAT:-}" ]; then
            echo "QEMU_SLS_PAT is configured -- proceeding to the qemu-sls checkout."
            exit 0
          fi
          code=$(curl -sL --max-time 15 -o /dev/null -w '%{http_code}' \
            https://api.github.com/repos/kubeworkz/qemu-sls)
          if [ "$code" = "200" ]; then
            echo "qemu-sls is public -- no secret needed, checkout will work anonymously."
            exit 0
          fi
          echo "::error::qemu-sls (kubeworkz/qemu-sls) is PRIVATE but the QEMU_SLS_PAT"
          echo "::error::secret is not configured (anonymous probe returned HTTP $code)."
          echo "::error::The host suite's sls_alloc_host_test reads ../qemu/sls/sls-runtime.c,"
          echo "::error::so verify cannot pass without this checkout. Fix: add a read-access"
          echo "::error::fine-grained PAT for kubeworkz/qemu-sls as the QEMU_SLS_PAT secret at"
          echo "::error::https://github.com/kubeworkz/aerosls/settings/secrets/actions"
          exit 1

      - uses: actions/checkout@v4
        with:
          repository: kubeworkz/qemu-sls
          path: qemu
          token: ${{ secrets.QEMU_SLS_PAT }}
          fetch-depth: 1

      - name: Host test suite (tests/*_host_test.c)
        run: bash tests/run_all.sh
        working-directory: aerosls2

      - name: Kernel syntax check (gcc -fsyntax-only, X86_C_SRC)
        run: bash tools/syntax_check_all.sh
        working-directory: aerosls2

      # ─── The *_check.sh guards ──────────────────────────────────────────
      # These were run by nothing until now: run_all.sh globs *_host_test.c,
      # and these are shell scripts, so the guards sat in tests/ passing
      # review and inspecting nothing. Each was written after the bug it
      # catches had already cost a diagnostic round.
      #
      # Three of the eighteen (makefile_sources, commands_doc,
      # script_conventions) read only sources and run here. The other
      # fifteen need a linked kernel or its objects, and this runner has no
      # x86_64-elf-gcc -- see the note at the top of this file -- so they
      # exit 2 and are reported as SKIP with the reason printed. A skip is
      # counted separately and never mistaken for a pass; read the step's
      # output rather than just its green tick. Those three are run for
      # real, with their teeth proven, in the kernel-guards job below.
      #
      # Use --require-all on a build host, where the prerequisites must
      # exist and "could not check" must not resemble "it is fine".
      - name: Guard scripts (tests/*_check.sh)
        run: bash tests/run_checks.sh
        working-directory: aerosls2

      # The step above proves the guards pass; the smokes prove they can
      # fail. Each *_smoke.sh deliberately breaks one guard's input and
      # asserts the guard exits 1 and names the violation — so a
      # regression that made a guard blind fails CI instead of sailing
      # through green. All three source-only guards have a smoke now:
      # script_conventions (index teeth: mode, shebang, CRLF),
      # makefile_sources (an unbuilt .c and a stale list entry),
      # commands_doc (the hex-vs-data field bug). They are *smoke.sh*,
      # not *_check.sh, so run_checks.sh and deploy.sh's guard gate never
      # run them.
      #
      # The five kernel-needing guards cannot run here (no cross
      # toolchain). The kernel-guards job below builds the real binary and
      # runs all eighteen guards and all nineteen smokes for real -- the
      # only skip is the runtime entropy guard, which needs a live cluster
      # even on a build host.
      - name: Script-conventions guard teeth (smoke)
        run: bash tests/script_conventions_smoke.sh
        working-directory: aerosls2

      - name: Makefile-sources guard teeth (smoke)
        run: bash tests/makefile_sources_smoke.sh
        working-directory: aerosls2

      - name: Commands-doc guard teeth (smoke)
        run: bash tests/commands_doc_smoke.sh
        working-directory: aerosls2

  kernel-guards:
    # The five kernel-needing guards (stack_frame_budget, kernel_image_end,
    # no_tls_relocations, no_hosted_link, code_buffer_budget) need the
    # linked kernel and its objects, so they skip in `verify` and were
    # proven only on a build host. code_buffer_budget asserts the two
    # translation-cache buffers link at their declared sizes (32 MiB /
    # 4 MiB, read from the sources) and stay distinct. no_hosted_link is
    # the machine-checked form of the core
    # no-glibc/no-user-space property: the linked image must have zero
    # undefined symbols, no dynamic section, and no ELF interpreter -- a
    # hosted leak (-lc in the link, a hosted object linked in, a weak
    # undefined resolved to 0) fails the gate instead of halting a node at
    # runtime. This job builds the real shipping artifact (the bootable
    # ISO, via make x86-iso) and runs the deploy gate's two commands --
    # run_checks.sh --require-all and run_guard_smokes.sh -- so all
    # eighteen guards pass AND all nineteen smokes prove their teeth on
    # every push (the one runtime guard, entropy_boot_diversity, still
    # reports its owed skip: it needs a live cluster). Then it boots the
    # ISO under QEMU and checks the service end to end: the kernel's first
    # serial banner must appear, and its webapp must answer /api/health on
    # the forwarded port (the exact endpoint deploy.sh gates on) — proving
    # the webapp serves, not just that the kernel boots. Verified
    # end-to-end on a fresh checkout: the ISO builds, all eighteen guards
    # + all nineteen smokes pass, the ISO boots under QEMU, and /api/health
    # answers in ~10s.
    #
    # Toolchain: the cross compiler (x86_64-elf-gcc) is replaced by the
    # host gcc/ld via the X86_CC/X86_LD overrides. The kernel is
    # freestanding x86-64 and the guards themselves compile with plain gcc,
    # so the linked artifacts are equivalent for everything the guards
    # inspect. The Makefile builds only the x86-iso target here -- no
    # plugins (llvm) and no riscv-elf toolchain required.
    #
    # The kernel links 15 objects out of ../qemu, so the sibling repo must
    # be checked out next to aerosls2 (the Makefile's hardcoded ../qemu
    # path). qemu-sls is kubeworkz/qemu-sls: if it is private, set the
    # QEMU_SLS_PAT secret to a token with read access; if public, no secret
    # is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aerosls2

      # qemu-sls (kubeworkz/qemu-sls) is a private repo, so the
      # checkout below needs the QEMU_SLS_PAT secret. When the secret
      # is missing, actions/checkout fails with a bare "Authentication
      # failed" that says nothing about what to fix. This guard fails
      # first with the actual cause and the fix: if no secret is set,
      # probe the repo anonymously -- a 200 means it went public (no
      # secret needed, checkout works anonymously), anything else means
      # the checkout would fail, so name the fix and stop.
      - name: Guard the qemu-sls checkout (private repo requires QEMU_SLS_PAT)
        env:
          QEMU_SLS_PAT: ${{ secrets.QEMU_SLS_PAT }}
        run: |
          set -u
          if [ -n "${QEMU_SLS_PAT:-}" ]; then
            echo "QEMU_SLS_PAT is configured -- proceeding to the qemu-sls checkout."
            exit 0
          fi
          # -L: the API answers 301 (moved to a repository-ID URL) for
          # public repos; without following it a public repo would be
          # misread as private and the guard would fail wrongly.
          code=$(curl -sL --max-time 15 -o /dev/null -w '%{http_code}' \
            https://api.github.com/repos/kubeworkz/qemu-sls)
          if [ "$code" = "200" ]; then
            echo "qemu-sls is public -- no secret needed, checkout will work anonymously."
            exit 0
          fi
          echo "::error::qemu-sls (kubeworkz/qemu-sls) is PRIVATE but the QEMU_SLS_PAT"
          echo "::error::secret is not configured (anonymous probe returned HTTP $code)."
          echo "::error::The kernel links objects out of ../qemu, so CI cannot build without"
          echo "::error::this checkout. Fix: add a read-access fine-grained PAT for"
          echo "::error::kubeworkz/qemu-sls as the QEMU_SLS_PAT secret at"
          echo "::error::https://github.com/kubeworkz/aerosls/settings/secrets/actions"
          exit 1

      - uses: actions/checkout@v4
        with:
          repository: kubeworkz/qemu-sls
          path: qemu
          token: ${{ secrets.QEMU_SLS_PAT }}
          fetch-depth: 1

      - name: Kernel build tools (nasm, grub, qemu)
        run: sudo apt-get update && sudo apt-get install -y nasm grub-pc-bin xorriso qemu-system-x86

      - name: Build the kernel ISO (host gcc/ld as the toolchain)
        run: make X86_CC=gcc X86_LD=ld x86-iso
        working-directory: aerosls2

      - name: Run all guards with --require-all (every build-run guard must pass)
        run: bash tests/run_checks.sh --require-all
        working-directory: aerosls2

      - name: Run all guard smokes (every guard proven able to fail)
        run: bash tests/run_guard_smokes.sh
        working-directory: aerosls2

      - name: Boot the ISO under QEMU and check /api/health (service smoke)
        run: |
          qemu-img create -f raw sls_storage.img 10G >/dev/null
          qemu-system-x86_64 -cdrom sls_operating_system.iso \
              -drive id=disk,file=sls_storage.img,if=none,format=raw \
              -device nvme,drive=disk,serial=slsdev0 \
              -netdev user,id=net0,hostfwd=tcp::3001-:3000 \
              -device e1000,netdev=net0,mac=52:54:00:12:34:01 \
              -display none -m 4G -smp 4 -boot d -no-reboot \
              -serial file:boot.log 2>/dev/null &
          QPID=$!
          # The kernel's webapp listens on guest port 3000, forwarded to host
          # 3001. Poll /api/health — the exact endpoint deploy.sh gates on —
          # until it answers, qemu dies (crash), or the window runs out.
          healthy=0
          qemu_alive=1
          for i in $(seq 1 75); do
            if curl -sf --max-time 2 http://localhost:3001/api/health > health.json 2>/dev/null; then
              healthy=1
              break
            fi
            if ! kill -0 "$QPID" 2>/dev/null; then
              qemu_alive=0
              break
            fi
            sleep 2
          done
          kill "$QPID" 2>/dev/null || true
          wait "$QPID" 2>/dev/null || true
          if [ "$healthy" -ne 1 ]; then
            if [ "$qemu_alive" -eq 0 ]; then
              echo "FAILED: qemu exited before /api/health answered — kernel crashed" >&2
            else
              echo "FAILED: /api/health never answered within the poll window" >&2
            fi
            tail -30 boot.log >&2
            exit 1
          fi
          grep -q "AEROSLS BOOT LOGGER" boot.log || {
            echo "FAILED: boot banner not seen in the serial log" >&2
            tail -30 boot.log >&2
            exit 1
          }
          # Assert the BODY, not just the 200: a degraded service could still
          # answer. status must be "ok" and uptime_ticks a positive integer.
          if ! python3 -c '
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception as e:
              sys.exit("health JSON unparseable: %s" % e)
          if d.get("status") != "ok":
              sys.exit("status is %r, expected \"ok\"" % d.get("status"))
          u = d.get("uptime_ticks")
          if isinstance(u, bool) or not isinstance(u, int) or u <= 0:
              sys.exit("uptime_ticks is %r, expected a positive integer" % u)
          print("OK: /api/health status=ok uptime_ticks=%d" % u)
          ' health.json; then
            echo "FAILED: /api/health body assertion failed — a 200 from a degraded service" >&2
            echo "         body was: $(cat health.json)" >&2
            tail -30 boot.log >&2
            exit 1
          fi
          echo "OK: kernel booted from the ISO and /api/health answered"
        working-directory: aerosls2

  decoder-build:
    # The kernel-guards job builds the SHIPPING config (SLS_X86_FRONTEND
    # off -- what deploy.sh builds and what runs in production). The
    # decoder build (SLS_X86_FRONTEND=on, QEMU's real x86-64 frontend
    # driving the Step 6.3 translator loop) is a SEPARATE configuration
    # with its own TCG_CFLAGS and its own object list, and launcher code
    # must link in BOTH. It is not enough to be right in the config you
    # happened to test locally: the M5 exit-status global landed inside
    # the frontend ifdef, the decoder build linked fine, and the default
    # build failed to link at deploy time -- the exact gap this job
    # closes. Building both configs on every push means a launcher
    # change that breaks one of them fails CI instead of the first
    # deploy after it lands.
    #
    # The decoder build is also where the M5 gate lives: /api/qemu/elf
    # (a real `gcc -static` ELF64 parsed and placed by sls-elf64-loader,
    # run to exit_group(0) through the Linux-compat syscall shim) and
    # /api/qemu/elf-reject (a PT_INTERP dynamic binary must be refused
    # loudly). The compiled fixture (/api/qemu/compiled, the M4-era
    # regression) must still pass on this config too -- a decoder change
    # that regresses it fails here.
    #
    # Endpoints require a non-GUEST bearer token. Dave's fixed
    # DB_ADMIN demo token (kernel/auth.c) is deterministic and
    # no-expiry, so CI can use it directly -- same as the deployed
    # simulator's login flow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aerosls2

      # qemu-sls (kubeworkz/qemu-sls) is a private repo, so the
      # checkout below needs the QEMU_SLS_PAT secret. When the secret
      # is missing, actions/checkout fails with a bare "Authentication
      # failed" that says nothing about what to fix. This guard fails
      # first with the actual cause and the fix: if no secret is set,
      # probe the repo anonymously -- a 200 means it went public (no
      # secret needed, checkout works anonymously), anything else means
      # the checkout would fail, so name the fix and stop.
      - name: Guard the qemu-sls checkout (private repo requires QEMU_SLS_PAT)
        env:
          QEMU_SLS_PAT: ${{ secrets.QEMU_SLS_PAT }}
        run: |
          set -u
          if [ -n "${QEMU_SLS_PAT:-}" ]; then
            echo "QEMU_SLS_PAT is configured -- proceeding to the qemu-sls checkout."
            exit 0
          fi
          # -L: the API answers 301 (moved to a repository-ID URL) for
          # public repos; without following it a public repo would be
          # misread as private and the guard would fail wrongly.
          code=$(curl -sL --max-time 15 -o /dev/null -w '%{http_code}' \
            https://api.github.com/repos/kubeworkz/qemu-sls)
          if [ "$code" = "200" ]; then
            echo "qemu-sls is public -- no secret needed, checkout will work anonymously."
            exit 0
          fi
          echo "::error::qemu-sls (kubeworkz/qemu-sls) is PRIVATE but the QEMU_SLS_PAT"
          echo "::error::secret is not configured (anonymous probe returned HTTP $code)."
          echo "::error::The kernel links objects out of ../qemu, so CI cannot build without"
          echo "::error::this checkout. Fix: add a read-access fine-grained PAT for"
          echo "::error::kubeworkz/qemu-sls as the QEMU_SLS_PAT secret at"
          echo "::error::https://github.com/kubeworkz/aerosls/settings/secrets/actions"
          exit 1

      - uses: actions/checkout@v4
        with:
          repository: kubeworkz/qemu-sls
          path: qemu
          token: ${{ secrets.QEMU_SLS_PAT }}
          fetch-depth: 1

      - name: Kernel build tools (nasm, grub, qemu)
        run: sudo apt-get update && sudo apt-get install -y nasm grub-pc-bin xorriso qemu-system-x86

      - name: Build the decoder kernel ISO (SLS_X86_FRONTEND=on)
        run: make X86_CC=gcc X86_LD=ld SLS_X86_FRONTEND=on x86-iso
        working-directory: aerosls2

      - name: Boot the decoder ISO and run the Step 6.4/M5 guest fixtures
        run: |
          qemu-img create -f raw sls_storage.img 10G >/dev/null
          qemu-system-x86_64 -cdrom sls_operating_system.iso \
              -drive id=disk,file=sls_storage.img,if=none,format=raw \
              -device nvme,drive=disk,serial=slsdev0 \
              -netdev user,id=net0,hostfwd=tcp::3001-:3000 \
              -device e1000,netdev=net0,mac=52:54:00:12:34:01 \
              -display none -m 4G -smp 4 -boot d -no-reboot \
              -serial file:decoder_boot.log 2>/dev/null &
          QPID=$!
          healthy=0
          for i in $(seq 1 75); do
            if curl -sf --max-time 2 http://localhost:3001/api/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            if ! kill -0 "$QPID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "FAILED: decoder kernel never answered /api/health" >&2
            tail -30 decoder_boot.log >&2
            kill "$QPID" 2>/dev/null || true
            exit 1
          fi
          TOK=deadbeef01234567cafebabe76543210   # dave, DB_ADMIN
          fail=0
          for ep in compiled elf elf-reject; do
            body=$(curl -s --max-time 120 -X POST \
              "http://localhost:3001/api/qemu/$ep" \
              -H "Authorization: Bearer $TOK")
            echo "$ep -> $body"
            echo "$body" | grep -q '"pass":"true"' || {
              echo "FAILED: /api/qemu/$ep did not pass ($body)" >&2
              fail=1
            }
          done
          kill "$QPID" 2>/dev/null || true
          wait "$QPID" 2>/dev/null || true
          grep -q "SLS-ELF-TEST] PASS" decoder_boot.log || {
            echo "FAILED: [SLS-ELF-TEST] PASS not in the serial log" >&2
            tail -30 decoder_boot.log >&2
            fail=1
          }
          grep -q "SLS-ELF-REJECT] PASS" decoder_boot.log || {
            echo "FAILED: [SLS-ELF-REJECT] PASS not in the serial log" >&2
            tail -30 decoder_boot.log >&2
            fail=1
          }
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: decoder build links and boots; compiled + elf + elf-reject fixtures all pass"
        working-directory: aerosls2

  riscv-guards:
    # The RISC-V kernel's boot smoke, mirrored from the x86 kernel-guards
    # job. The RV kernel is self-contained (its sources are all in
    # aerosls2 — no ../qemu sibling repo needed), but pre-9e it was
    # unbuildable and unbootable: `make riscv-elf` could not link
    # (trap_riscv.S/.c object collision + a dangling route_sls_shell_command
    # symbol), and once it did link it would not boot (kernel base at
    # 0x80000000 colliding with OpenSBI, an a0==0 boot gate vs OpenSBI's
    # arbitrary boot-hart id, and a legacy console that OpenSBI silently
    # drops for S-mode guests). All six defects found and fixed — see
    # AeroSLS-SIMI-ISA-v0.1.md §16 Phase 9, 9e addendum.
    #
    # There is no webapp on the RISC-V port, so the "service" assertions
    # are the port's equivalents of the x86 health check: the boot banner,
    # the SIMI translate-and-execute smoke (the embedded rv64_boot_smoke
    # tmo running as real RV64-native code), and — since 9f — the real
    # syscall path: the SIMI return becomes RV_SYS_EXIT (a7=164) triggered
    # through ebreak (the one exception OpenSBI's default MEDELEG
    # delegates; ecall-from-S-mode is not), and riscv_syscall_dispatch()
    # powers the machine off via OpenSBI's SBI_SRST extension, so QEMU
    # exits rc=0 (clean shutdown) instead of being killed by the timeout.
    # See AeroSLS-SIMI-ISA-v0.1.md §16 Phase 9, 9f addendum.
    #
    # Phase 9g added the second boot path: `make riscv-elf` also builds
    # sls_riscv_kernel_m.elf — the same sources recompiled with
    # -DRISCV_MMODE and linked at 0x80000000 — which QEMU enters directly
    # in M-mode (`-bios none`, no OpenSBI at all). Its console is the raw
    # 16550 UART, its traps go to mtvec, and it has no firmware to power
    # off with, so its smoke ends in a reported, deliberate halt (rc=124
    # timeout) instead of a clean shutdown. Both boot paths are asserted
    # below. See AeroSLS-SIMI-ISA-v0.1.md §16 Phase 9, 9g addendum.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RISC-V toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf qemu-system-misc

      - name: Build the RISC-V kernel (riscv-elf)
        run: |
          make riscv-elf
          # Design A + Design B part 2 (ISA doc §16 Phase 16 audit
          # addendum): the function-scoped FP census — the LOAD-BEARING
          # guard. The S-mode boot runs under OpenSBI with sstatus.FS=3
          # (an FP instruction would EXECUTE silently there); only the
          # bare-metal M-mode boot keeps FS=Off and traps. Design B part 2
          # adds a deliberate, contained FP user (fp_save_all/
          # fp_load_all, the two-owner lazy-save plumbing), so the census
          # allow-lists exactly those two helpers and fails on ANY other
          # FP/vector instruction — checked across all four kernels.
          bash tools/simi/tests/rv64_fp_census.sh || {
            echo "FAILED: a RISC-V kernel ELF contains FP/vector instructions (the census above prints them)" >&2
            exit 1
          }

      - name: Boot the kernel under QEMU and assert the boot smoke + SBI_SRST shutdown
        run: |
          # The kernel ends its boot smoke with RV_SYS_EXIT, which powers
          # the machine off via OpenSBI's SBI_SRST extension — so QEMU
          # must exit rc=0 by itself. rc=124 means the timeout killed a
          # still-running kernel (the syscall never fired); anything else
          # is an early crash. The `if` wrapper handles GitHub's default
          # `set -e`, which would otherwise abort before the log tail can
          # print.
          if timeout 60 qemu-system-riscv64 -M virt -bios default -kernel sls_riscv_kernel.elf \
             -m 4G -smp 4 -display none -serial file:boot_rv.log -no-reboot; then
            echo "OK: qemu exited rc=0 — the kernel powered itself off via SBI_SRST"
          else
            rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "FAILED: timeout (rc=124) — the kernel never issued RV_SYS_EXIT/SBI_SRST shutdown" >&2
            else
              echo "FAILED: qemu exited early (rc=$rc) — kernel crashed before shutdown" >&2
            fi
            tail -30 boot_rv.log >&2
            exit 1
          fi
          grep -a "AeroSLS RISC-V Supervisor Node Kernel Online!" boot_rv.log || {
            echo "FAILED: RISC-V boot banner not seen in the serial log" >&2
            tail -30 boot_rv.log >&2
            exit 1
          }
          grep -a "\[SIMI\] entry returned (real machine code executed)" boot_rv.log || {
            echo "FAILED: SIMI boot smoke did not translate and execute" >&2
            tail -30 boot_rv.log >&2
            exit 1
          }
          grep -a "\[SYSCALL\] SYS_SLS_EXIT, code=42" boot_rv.log || {
            echo "FAILED: the SIMI return never became the RV_SYS_EXIT syscall" >&2
            tail -30 boot_rv.log >&2
            exit 1
          }
          # Design A: the honest mode-exact FP state. Under OpenSBI,
          # sstatus.FS=3 (Dirty) — FP is architecturally ENABLED on this
          # boot path, so the census above (not a trap) is what keeps the
          # kernel FP-free; the line reports the value and the honest
          # state-dependent interpretation.
          grep -a "\[M5-audit\] sstatus.FS=3 (not Off: FP/vector would EXECUTE" boot_rv.log || {
            echo "FAILED: sstatus.FS did not log the S-mode Dirty state (FS=3)" >&2
            tail -30 boot_rv.log >&2
            exit 1
          }
          # Design B part 2: the two-owner FP lazy-save round-trip runs
          # BEFORE the boot smoke (which powers off). The smoke disables
          # FP (FS=Off), so each owner's first FP instruction traps
          # scause=2 and the code==2 branch lazy-saves — proving the FS
          # lazy-save works in S-mode too (OpenSBI normally leaves FS=3;
          # the smoke's explicit Off is what arms the trap path here).
          grep -a "\[FP-SMOKE\] round-trip: ALL PASS" boot_rv.log || {
            echo "FAILED: the FP lazy-save round-trip did not pass in S-mode" >&2
            tail -30 boot_rv.log >&2
            exit 1
          }
          grep -a "\[FP-SMOKE\] owner B run: 0x4034000000000000 = 20.0 PASS" boot_rv.log || {
            echo "FAILED: owner B did not compute 20.0 after the lazy-save" >&2
            tail -30 boot_rv.log >&2
            exit 1
          }
          # 18 total = the smoke's 3 (A cold start, B, A reload) + the
          # ready-queue demo's 15 (one per slice). Was -eq 3 from part 2
          # until the demo's slices added theirs — a latent CI break the
          # cadence stress work surfaced and fixed.
          [ "$(grep -ac '\[FP\] lazy-save:' boot_rv.log)" -eq 18 ] || {
            echo "FAILED: expected exactly 18 lazy-saves (3 smoke + 15 demo slices)" >&2
            tail -30 boot_rv.log >&2
            exit 1
          }
          # Follow-up #11: the per-slice LCG teeth — the embedded
          # lcg_slice.tmo runs one full per-slice budget of the task LCG
          # (200,000 iterations, mod 2^32) through the RV translator and
          # RETURNS the acc tooth; the serial log must assert
          # 0x0b6f2a40 = 191834688 with a PASS verdict (the arm64
          # kernel's identical teeth, mirrored on the RISC-V boot). A
          # wrong recurrence (missing mask, swapped constants, off-by-
          # one count) fails here.
          grep -a "lcg slice executed (one per-slice budget) -- acc=0x000000000b6f2a40 (expected 0x0b6f2a40 = 191834688) PASS" boot_rv.log || {
            echo "FAILED: the LCG slice did not execute and return the per-slice tooth 0x0b6f2a40" >&2
            tail -30 boot_rv.log >&2
            exit 1
          }
          # Design B part 3 + preemption follow-up: the three-task FP
          # ready queue with TRUE preemption — the tick handler itself
          # rotates the running task (rv_scheduler_tick swaps the
          # trap-frame ctx image; the coroutine switch is left to the
          # boot-context entry/handoff only). FP state rides the fp_save
          # owner rows, one lazy-save per slice = exactly 15 more after
          # the smoke's 3, the preemption accounting (one tick rotation
          # per slice boundary per task) is the same 15, and the
          # FAIRNESS probe holds at the ALL-HEAVY extreme: every task
          # ran the same 10x-heavy per-slice LCG work (1,000,000 each;
          # acc 0xf2dc5340 all three — the host-precomputed teeth) yet
          # still got exactly 5 preemptions — the round-robin is
          # workload-oblivious. The demo runs at the tightened 2ms tick
          # cadence (the sub-print-cost stress, 50x the original 100ms
          # rate) and the 15/15 accounting must survive it — the
          # per-tick preempt prints are batched into the driver's
          # [TASK] preempt log instead of printed inline, and the
          # lazy-save line is shortened, to keep the print path inside
          # the slice budget.
          grep -a "\[TASK\] three-task FP ready queue (preemptive, real register contexts, 2ms tick cadence" boot_rv.log || {
            echo "FAILED: the ready queue did not run at the 2ms tick cadence in S-mode" >&2
            tail -30 boot_rv.log >&2
            exit 1
          }
          grep -a "\[TASK\] ready queue: ALL PASS" boot_rv.log || {
            echo "FAILED: the three-task FP ready queue did not pass in S-mode" >&2
            tail -30 boot_rv.log >&2
            exit 1
          }
          grep -a "\[TASK\] fp_save rows: A=0x4014000000000000 B=0x4004000000000000 C=0x3ff4000000000000 PASS; lazy-saves during demo: 15 PASS; preemptions: 15 PASS; work: 1000000/1000000/1000000 (equal) PASS; acc: 0x00000000f2dc5340/0x00000000f2dc5340/0x00000000f2dc5340 PASS" boot_rv.log || {
            echo "FAILED: the ready-queue final rows/count did not hold in S-mode" >&2
            tail -30 boot_rv.log >&2
            exit 1
          }
          # The wall-clock cadence teeth: the kernel checks elapsed mtime
          # from the first preemption to the queue emptying against the
          # ACTUAL rotation count (average interval below 1.5 ticks) —
          # the demo's in_work gate makes the 15/15 accounting exact by
          # construction, and on a slow host the wall time stretches
          # while the average interval stays ~2ms, so a flat bound would
          # flake. The check still fails a genuine 4ms-or-slower cadence
          # (it averages 2.0 ticks per interval) and a faster-than-2ms
          # one (the lower bound). The exact value is host-dependent, so
          # only the shape is pinned here.
          grep -aE "mtime: [0-9]+ PASS" boot_rv.log || {
            echo "FAILED: the demo's measured wall-clock cadence did not match the 2ms tick in S-mode" >&2
            tail -30 boot_rv.log >&2
            exit 1
          }
          echo "OK: RISC-V kernel booted, FP lazy-save + three-task ready queue passed, SIMI smoke executed, RV_SYS_EXIT powered off via SBI_SRST"

      - name: Boot the kernel as a direct M-mode payload and assert the boot smoke + halt
        run: |
          # The second RV boot path (Phase 9g). `-M virt` defaults to
          # OpenSBI even without -bios, so the true bare-metal path needs
          # `-bios none` plus the M-mode variant (sls_riscv_kernel_m.elf,
          # linked at 0x80000000, -DRISCV_MMODE): QEMU enters it directly
          # in M-mode with no firmware — console is the raw 16550 UART,
          # traps go to mtvec, and there is no SBI_SRST to power the
          # machine off, so the kernel reports the exit and halts. QEMU is
          # killed by the timeout (rc=124); rc=0 would mean the kernel
          # exited cleanly without firmware (impossible), anything else is
          # an early crash.
          if timeout 60 qemu-system-riscv64 -M virt -bios none -kernel sls_riscv_kernel_m.elf \
             -m 4G -smp 4 -display none -serial file:boot_rv_m.log -no-reboot; then
            echo "FAILED: qemu exited rc=0 — the M-mode kernel should halt (no firmware to power off)" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 124 ]; then
              echo "FAILED: qemu exited early (rc=$rc) — kernel crashed in M-mode" >&2
              tail -30 boot_rv_m.log >&2
              exit 1
            fi
          fi
          grep -a "AeroSLS RISC-V Supervisor Node Kernel Online!" boot_rv_m.log || {
            echo "FAILED: M-mode boot banner not seen in the serial log" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          }
          grep -a "\[SIMI\] entry returned (real machine code executed)" boot_rv_m.log || {
            echo "FAILED: SIMI boot smoke did not translate and execute in M-mode" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          }
          grep -a "\[SYSCALL\] SYS_SLS_EXIT, code=42" boot_rv_m.log || {
            echo "FAILED: the SIMI return never became the RV_SYS_EXIT syscall in M-mode" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          }
          # Design A: the bare-metal backstop — FS stays at reset (Off),
          # so an FP/vector access would trap scause=2 to the dispatcher's
          # FP-free diagnostic (asserted end-to-end by the teeth step).
          grep -a "\[M5-audit\] sstatus.FS=0 (Off: FP/vector accesses trap scause=2)" boot_rv_m.log || {
            echo "FAILED: sstatus.FS did not log the M-mode Off state (FS=0)" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          }
          # Design B part 2: the lazy-save round-trip on the bare-metal
          # path — FS starts at reset (Off), the smoke's first FP access
          # traps scause=2 to the code==2 lazy-save branch, and both
          # owners' distinct state (A: +inf + DZ; B: 20.0 clean) round-
          # trips through their fp_save rows.
          grep -a "\[FP-SMOKE\] round-trip: ALL PASS" boot_rv_m.log || {
            echo "FAILED: the FP lazy-save round-trip did not pass in M-mode" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          }
          grep -a "\[FP-SMOKE\] A evicted into fp_save\[0\]: f10=0x7ff0000000000000, fcsr DZ=1 PASS" boot_rv_m.log || {
            echo "FAILED: A's +inf+DZ state did not survive B's eviction" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          }
          # 18 total = the smoke's 3 + the demo's 15 per-slice lazy-saves.
          [ "$(grep -ac '\[FP\] lazy-save:' boot_rv_m.log)" -eq 18 ] || {
            echo "FAILED: expected exactly 18 lazy-saves (3 smoke + 15 demo slices)" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          }
          # Follow-up #11: the per-slice LCG teeth on the bare-metal path
          # too — same embedded program, same 0x0b6f2a40 assert, now
          # through the M-mode translator/executor.
          grep -a "lcg slice executed (one per-slice budget) -- acc=0x000000000b6f2a40 (expected 0x0b6f2a40 = 191834688) PASS" boot_rv_m.log || {
            echo "FAILED: the LCG slice did not return the per-slice tooth 0x0b6f2a40 in M-mode" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          }
          # Design B part 3 + preemption follow-up: the three-task FP
          # ready queue on the bare-metal path too — the same preemptive
          # tick-handler rotation + FP owner rows, 15 per-slice
          # lazy-saves and 15 preemptions after the smoke's 3, plus the
          # fairness probe (all-heavy extreme with exact accounting),
          # all at the tightened 2ms tick cadence (with the batched
          # preempt log + shortened lazy-save line keeping the print
          # path inside the slice budget).
          grep -a "\[TASK\] three-task FP ready queue (preemptive, real register contexts, 2ms tick cadence" boot_rv_m.log || {
            echo "FAILED: the ready queue did not run at the 2ms tick cadence in M-mode" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          }
          grep -a "\[TASK\] ready queue: ALL PASS" boot_rv_m.log || {
            echo "FAILED: the three-task FP ready queue did not pass in M-mode" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          }
          grep -a "\[TASK\] fp_save rows: A=0x4014000000000000 B=0x4004000000000000 C=0x3ff4000000000000 PASS; lazy-saves during demo: 15 PASS; preemptions: 15 PASS; work: 1000000/1000000/1000000 (equal) PASS; acc: 0x00000000f2dc5340/0x00000000f2dc5340/0x00000000f2dc5340 PASS" boot_rv_m.log || {
            echo "FAILED: the ready-queue final rows/count did not hold in M-mode" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          }
          # Same wall-clock cadence teeth as the S-mode leg.
          grep -aE "mtime: [0-9]+ PASS" boot_rv_m.log || {
            echo "FAILED: the demo's measured wall-clock cadence did not match the 2ms tick in M-mode" >&2
            tail -30 boot_rv_m.log >&2
            exit 1
          }
          echo "OK: M-mode kernel booted, FP lazy-save + three-task ready queue passed, SIMI smoke executed, graceful halt reached"

      - name: Boot the UART-echo kernel and assert the device-driven RX interrupt echo
        run: |
          # Phase 9i: the echo build (sls_riscv_kernel_echo.elf, built by
          # `make riscv-elf` above) arms the PLIC for the 16550 UART;
          # every received character interrupts the hart through the real
          # trap entry and is echoed by the SEIP handler (claim, direct
          # 16550 RBR drain, complete). QEMU holds the VM until the serial
          # client connects (server=on,wait=on — no boot output is
          # dropped), then echo_client.py (passed `tick`, Phase 9k) drives
          # the interrupt-count tripwire (three isolated keystrokes, each
          # exactly one interrupt — [IRQ#N] prints after the complete()),
          # waits for [TICK 2 Us] — the periodic supervisor timer (STIP via
          # the Sstc stimecmp write, armed at boot and re-armed inside
          # every tick handler) printing its count after the re-arm, which
          # proves the timer is periodic, not one-shot. On the echo build
          # the period is 100ms (Phase 9n contention probe), so the client
          # also asserts the tick numbers stay an unbroken run (no missed
          # re-arms) while interleaving with the UART [IRQ] tripwire — plus
          # the full command loop:
          # help, a backspace-edited CR-only line (PING\bX -> unknown
          # command PINX), echo <text>, and `exit` — which powers the
          # machine off via SBI_SRST, so QEMU must exit rc=0 (rc=124
          # means the exit command never fired).
          rm -f /tmp/sls_echo.sock
          timeout 40 qemu-system-riscv64 -M virt -m 128M -smp 1 \
            -chardev socket,id=s0,path=/tmp/sls_echo.sock,server=on,wait=on \
            -serial chardev:s0 -kernel sls_riscv_kernel_echo.elf -nographic \
            >echo_qemu.log 2>&1 &
          qpid=$!
          python3 tools/simi/tests/echo_client.py /tmp/sls_echo.sock tick >echo_client.log 2>&1
          crc=$?
          # `wait` returns 124 when QEMU is killed by the timeout -- the
          # EXPECTED outcome for the M-mode kernel (no firmware to power
          # off with), and the S-mode kernel's timeout-kill failure mode.
          # Under the step shell's `bash -e` a bare `wait` aborting on
          # 124 would kill the step BEFORE the rc check below runs, so
          # capture the status through `||` (exempt from set -e) instead.
          # rc is initialized first: `|| rc=$?` assigns only when wait
          # FAILS, so an S-mode kernel that powers off cleanly (rc=0)
          # must not leave rc unset for the check below.
          rc=0
          wait $qpid || rc=$?
          if [ "$rc" -eq 0 ] && [ "$crc" -eq 0 ] && grep -q "ECHO_OK" echo_client.log; then
            echo "OK: device-driven UART RX interrupt echo + command loop + 100ms periodic timer + round-robin time-slicing + wall-clock uptime + no-missed-re-arm contention probe verified ([TICK 2 Us], tasks table, exit -> rc=0)"
          else
            echo "FAILED: echo check failed (qemu rc=$rc, client rc=$crc)" >&2
            cat echo_client.log echo_qemu.log >&2
            exit 1
          fi

      - name: Boot the UART-echo kernel as an M-mode payload and assert the device-driven echo
        run: |
          # Phase 9i M-mode twin: the same echo over the bare-metal path —
          # the M-mode PLIC context, mie.MEIE + mstatus.MIE, trap at mtvec
          # with mcause = bit63+11. `-bios none` + sls_riscv_kernel_echo_m.elf
          # (built by `make riscv-elf` above, linked at 0x80000000). Same
          # socket protocol as the S-mode echo step, plus the Phase 9k
          # timer twin: the bare-metal build arms the periodic tick (100ms
          # on the echo build, Phase 9n contention probe) by programming
          # the CLINT mtimecmp MMIO directly and enables mie.MTIE, so the
          # client is passed `tick` and asserts [TICK 2 Us] (MTIP, re-armed)
          # plus the no-missed-re-arm run.
          # rc=124 is success here because the M-mode `exit` has no firmware
          # to power off with — it reports the halt and spins (killed by the
          # timeout).
          rm -f /tmp/sls_echo_m.sock
          timeout 40 qemu-system-riscv64 -M virt -m 128M -smp 1 -bios none \
            -chardev socket,id=s0,path=/tmp/sls_echo_m.sock,server=on,wait=on \
            -serial chardev:s0 -kernel sls_riscv_kernel_echo_m.elf -nographic \
            >echo_m_qemu.log 2>&1 &
          qpid=$!
          python3 tools/simi/tests/echo_client.py /tmp/sls_echo_m.sock tick >echo_m_client.log 2>&1
          crc=$?
          # `wait` returns 124 when QEMU is killed by the timeout -- the
          # EXPECTED outcome for the M-mode kernel (no firmware to power
          # off with), and the S-mode kernel's timeout-kill failure mode.
          # Under the step shell's `bash -e` a bare `wait` aborting on
          # 124 would kill the step BEFORE the rc check below runs, so
          # capture the status through `||` (exempt from set -e) instead.
          # rc is initialized first: `|| rc=$?` assigns only when wait
          # FAILS, so an S-mode kernel that powers off cleanly (rc=0)
          # must not leave rc unset for the check below.
          rc=0
          wait $qpid || rc=$?
          if [ "$rc" -eq 124 ] && [ "$crc" -eq 0 ] && grep -q "ECHO_OK" echo_m_client.log; then
            echo "OK: M-mode device-driven UART RX interrupt echo + 100ms periodic timer + round-robin time-slicing + wall-clock uptime + no-missed-re-arm contention probe verified ([TICK 2 Us] via CLINT mtimecmp, tasks table)"
          else
            echo "FAILED: M-mode echo check failed (qemu rc=$rc, client rc=$crc)" >&2
            cat echo_m_client.log echo_m_qemu.log >&2
            exit 1
          fi

      - name: Kernel copy compiles under RV_CFLAGS with zero undefined symbols
        run: |
          # The RV64 kernel translator copy (kernel/simi_riscv.c) gets the
          # same audit the ARM copy got (plan doc §10.181): compile it with
          # the EXACT RV_CFLAGS the kernel build uses and assert (a) zero
          # warnings and (b) ZERO undefined symbols. The RV64 kernel links
          # -nostdlib and provides no global memcpy/memset, so the contract
          # is strictly empty — any symbol (printf, malloc, or a GCC-
          # synthesized memcpy) would fail the link. The toolchain here is
          # the same one that built `make riscv-elf` above.
          out=$(bash tools/simi/tests/simi_riscv_kernel_check.sh 2>&1)
          echo "$out"
          echo "$out" | grep -q "0 violations" || {
            echo "FAILED: kernel/simi_riscv.c does not compile clean under RV_CFLAGS or has undefined symbols" >&2
            exit 1
          }

      - name: Teeth — RV64 kernel-copy guard smokes (broken copies must fail)
        run: |
          # The check above proves the copy is clean; this proves the check
          # has teeth. tools/simi/tests/simi_riscv_kernel_smoke.sh
          # deliberately injects a libc call (printf) and an unused variable
          # into throwaway copies and asserts the SAME checks fail, plus
          # asserts the clean copy still passes (so the teeth are
          # meaningful). A check that has gone blind fails here.
          out=$(bash tools/simi/tests/simi_riscv_kernel_smoke.sh 2>&1)
          echo "$out"
          echo "$out" | grep -q "3 passed, 0 failed" || {
            echo "FAILED: RV64 kernel-copy gate teeth — a deliberate violation slipped through" >&2
            exit 1
          }

      - name: Teeth — RV64 FP census + trap smokes (an FP violation must fail)
        run: |
          # The census gate proves kernel FP use stays inside the two
          # sanctioned helpers; this proves the gate has teeth.
          # tools/simi/tests/rv64_fp_gate_smoke.sh injects a real fadd.d
          # into kernel_riscv.c, rebuilds, and asserts (a) the census
          # FAILS on the broken ELF (the fadd.d is outside fp_save_all/
          # fp_load_all) and (b) booting the broken M-MODE kernel
          # LAZY-SAVES the FP access (the Design B part 2 path: the
          # code==2 branch's "[FP] lazy-save:" line, then the float-smoke
          # round-trip and the SIMI smoke still run — the boot continues,
          # it does not halt at the trap) — then restores the tree. (The
          # S-mode build is not boot-asserted: under OpenSBI FS=3 makes
          # the same instruction execute silently, which is exactly why
          # the census tooth must fire.) A gate that has gone blind fails
          # here.
          out=$(bash tools/simi/tests/rv64_fp_gate_smoke.sh 2>&1)
          echo "$out"
          echo "$out" | grep -q "4 passed, 0 failed" || {
            echo "FAILED: RV64 FP gate teeth — a deliberate FP violation slipped through" >&2
            exit 1
          }

  arm64-guards:
    # M3 (docs/AeroSLS-SIMI-ARM-Backend-Plan-v0.1.md §6): the REAL
    # AArch64 execution proof. simi-arm-verify runs the emitted A64 words
    # through a64_exec.c, a purpose-built decoder — but a decoder that
    # AGREES with a wrong encoder passes the four-way parity invisibly,
    # and A64 architectural rules a64_exec is documented laxer about (SP
    # 16-byte alignment, 4-byte branch-target alignment) are never
    # checked at all. This job cross-compiles simi_arm_jit.c for
    # aarch64-linux-gnu (static) and EXECUTES the whole SIMI corpus on a
    # real A64 implementation — qemu-aarch64 user-mode — the same
    # translator (simi_arm.c) that will port into the kernel. The runner
    # skips cleanly without the toolchain; here it is installed, so the
    # run must be all-pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AArch64 cross toolchain and QEMU user-mode
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user qemu-system-arm

      - name: Build the M3 JIT harness (cross-compiled)
        run: make -C tools/simi simi-arm-jit

      - name: Execute the corpus on real A64 and assert all-pass
        run: |
          # `|| true` on the capture: under the default bash -e shell, a
          # non-zero exit from the command substitution aborts the step
          # BEFORE echo runs, swallowing the runner's diagnostics (the
          # failure showed as zero output plus a generic FAILED line).
          # The grep below owns the verdict; the output stays visible.
          out=$(tools/simi/tests/run_arm64_tests.sh 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "0 failed" || {
            echo "FAILED: M3 real-execution leg has failures — the emitted A64 code misbehaves on real A64" >&2
            exit 1
          }

      - name: Build the M4a+M4b+M4c+M5+M5.1+M5.2+M5.3 arm64 kernel and assert the boot + TTBR1/EL0 paging + activation cache + GIC ticks + nested-IRQ probe + SIMI smoke + PSCI shutdown
        run: |
          # M4a (plan doc §6 M4 / §10.187): sls_arm64_kernel.elf is the
          # first bootable AArch64 kernel — banner over the PL011, then
          # PSCI SYSTEM_OFF (smc #0) powers the machine off, so qemu must
          # exit rc=0 by itself. rc=124 means the shutdown call never
          # fired; anything else is an early crash — the riscv-guards
          # SBI_SRST discipline, mirrored. The working config is
          # virtualization=on (NOT secure, §10.188): that gives the virt
          # machine the SMC PSCI conduit and enters the payload at EL2;
          # the head drops to EL1 and the smc is intercepted by QEMU's
          # PSCI emulation.
          make arm64-elf
          # M5 FP/SIMD gate (plan doc §10.198, leg 2): the LINKED ELF must
          # contain ZERO FP/SIMD instructions — the machine-checked form of
          # the zero-FP claim. -mgeneral-regs-only constrains the C codegen,
          # but only this census sees the hand-written asm too; a violation
          # (fmov, vector ops, q/d-register forms) fails here.
          bash tools/simi/tests/arm64_fp_census.sh sls_arm64_kernel.elf || {
            echo "FAILED: the kernel ELF contains FP/SIMD instructions (the census above prints them)" >&2
            exit 1
          }
          if timeout 60 qemu-system-aarch64 -M virt,virtualization=on \
             -cpu cortex-a53 -m 1G -kernel sls_arm64_kernel.elf \
             -nographic -serial file:arm64_boot.log -no-reboot; then
            echo "OK: qemu exited rc=0 — PSCI SYSTEM_OFF powered the machine off"
          else
            rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "FAILED: timeout (rc=124) — PSCI SYSTEM_OFF never fired" >&2
            else
              echo "FAILED: qemu exited early (rc=$rc) — kernel crashed before shutdown" >&2
            fi
            tail -30 arm64_boot.log >&2
            exit 1
          fi
          grep -a "AeroSLS ARM64 Node Kernel Online!" arm64_boot.log || {
            echo "FAILED: arm64 boot banner not seen in the serial log" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          grep -a "exception level: EL1" arm64_boot.log || {
            echo "FAILED: the EL drop did not land at EL1" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          # M5 FP/SIMD gate (plan doc §10.198, leg 3 visible): CPACR_EL1 is
          # never written, so FPEN=0 (reset) — any FP/SIMD access traps to
          # the EL1h sync vector instead of executing. The log line pins the
          # state; the census above pins the image; the teeth smoke pins the
          # trap itself.
          grep -a "cpacr_el1=0x0000000000000000 (FPEN=0: FP/SIMD accesses trap to EL1)" arm64_boot.log || {
            echo "FAILED: CPACR_EL1 did not log FPEN=0 (the FP/SIMD trap backstop is not in place)" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          grep -a "PSCI SYSTEM_OFF" arm64_boot.log || {
            echo "FAILED: the PSCI farewell line not seen" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          # M4b (plan doc §6 M4 / §10.189): kernel/simi_arm.c is linked
          # into this image and the embedded arm64_boot_smoke.tmo is
          # translated at boot, executed as real machine code, and must
          # return 42 (x9/t0). This asserts the LINK + the call — the
          # milestone's whole point. The kernel provides the
          # freestanding {memcpy, memset} pair the §10.181 gate permits;
          # a missing pair fails the link with undefined symbols.
          grep -a "entry returned (real machine code executed) -- result=0x000000000000002a" arm64_boot.log || {
            echo "FAILED: the M4b SIMI boot smoke did not execute and return 42" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          # §10.200: the per-slice LCG teeth on the arm64 kernel — the
          # embedded lcg_slice.tmo runs one full per-slice budget of the
          # fairness probe's task LCG (200,000 iterations, mod 2^32) in
          # EL1 and RETURNS the acc tooth; the serial log must assert
          # 0x0b6f2a40 = 191834688 with a PASS verdict. A wrong
          # recurrence (missing mask, swapped constants, off-by-one
          # count) fails here — the "the work provably ran" proof,
          # mirrored from the RISC-V kernel's task LCG.
          grep -a "lcg slice executed (one per-slice budget) -- acc=0x000000000b6f2a40 (expected 0x0b6f2a40 = 191834688) PASS" arm64_boot.log || {
            echo "FAILED: the LCG slice did not execute and return the per-slice tooth 0x0b6f2a40" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          # M5 (plan doc §10.191): the kernel was relinked to TTBR1 high
          # VAs, so the first assert pins the TTBR1-pure claim (TTBR0 is
          # parked on an all-invalid root). The two walk lines pin the
          # same VMSAv8-64 table tree M4c proved, now serving the kernel
          # from TTBR1 (device+PXN UART page, normal-WBWA kernel block).
          grep -a "\[M5\] TTBR1 kernel: VMA=0xFFFF000040080000" arm64_boot.log || {
            echo "FAILED: the kernel did not run TTBR1-pure from its high VMA" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          grep -a "TTBR1 kernel walk(0xFFFF000040080000) block attr=1" arm64_boot.log || {
            echo "FAILED: the TTBR1 walk did not yield the kernel's normal block" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          grep -a "TTBR1 kernel walk(0xFFFF000009000000) L3 attr=0 pxn=1 (device)" arm64_boot.log || {
            echo "FAILED: the TTBR1 walk did not yield the UART device page (attr 0, PXN)" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          # M5 user-mode paging: the translated SIMI program runs in EL0
          # from a VA the kernel's OWN tables do not map. The first assert
          # is the split's whole point (same VA: fault in kernel tables,
          # EL0-executable page in the user TTBR0 tree). The second pins
          # the EL0 excursion: eret into the blob, trampoline br x30 into
          # the svc stub, SVC back, and the result 42 (x9 at the svc)
          # printed by the kernel continuation before PSCI powers off.
          grep -a "kernel walk(0x10000000) = 0 (unmapped-to-kernel)" arm64_boot.log || {
            echo "FAILED: the user VA 0x10000000 is mapped in the kernel tables (no split?)" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          grep -a "user walk(0x10000000) L3=0x" arm64_boot.log || {
            echo "FAILED: the user TTBR0 tree has no page at 0x10000000" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          grep -a "uxn=0 (el0-exec)" arm64_boot.log || {
            echo "FAILED: the user code page is not EL0-executable" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          grep -a "returned from EL0 -- user result=0x000000000000002a (expected 0x2a = 42)" arm64_boot.log || {
            echo "FAILED: the EL0 SIMI program did not run and return 42 via SVC" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          # M5.1/M5.6 (plan doc §6 M5.1 / §10.192 + §10.201/§10.202):
          # the activation cache gate. The boot is EIGHT entries —
          # smoke EL1 (MISS), smoke EL1 (HIT), LCG EL1 (MISS), LCG EL0
          # (HIT), LCG EL0 (HIT), mem EL0 (MISS), mem EL0 (HIT), smoke
          # EL0 (HIT), smoke EL0 (HIT) — THREE translations (smoke +
          # LCG + mem, one per slot; the mem program is EL0-only, its
          # baked scratch is a user VA, so its first excursion is its
          # MISS). Each program's EL0 runs re-execute the same cached
          # bytes. The counts are occurrence counts (grep -o | wc -l),
          # NOT grep -c line counts: the kernel's UART lines carry
          # literal \r\n text, so several logical lines share one grep
          # line and -c undercounts (the pre-M5.1 asserts are substring
          # greps, immune either way).
          [ "$(grep -ao 'activation cache MISS' arm64_boot.log | wc -l)" -eq 3 ] || {
            echo "FAILED: expected exactly THREE activation cache MISSes (one translate per program)" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          [ "$(grep -ao 'activation cache HIT' arm64_boot.log | wc -l)" -eq 6 ] || {
            echo "FAILED: expected exactly SIX activation cache HITs (smoke EL1 re-entry, both LCG EL0 excursions, the second mem EL0 excursion, both smoke EL0 excursions)" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          [ "$(grep -ao 'entry returned (real machine code executed) -- result=0x000000000000002a' arm64_boot.log | wc -l)" -eq 2 ] || {
            echo "FAILED: expected exactly TWO EL1 direct executions returning 42" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          [ "$(grep -ao 'returned from EL0 -- user result=0x000000000000002a (expected 0x2a = 42)' arm64_boot.log | wc -l)" -eq 2 ] || {
            echo "FAILED: expected exactly TWO EL0 excursions returning 42" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          # §10.201: the LCG's EL0 containment proof — the SAME cached
          # bytes the EL1 slice ran (cache HIT, no re-translation) are
          # re-executed at EL0 and must return the identical tooth
          # 0x0b6f2a40, twice. A discrepancy here is a
          # containment/eret fault, not a codegen change.
          [ "$(grep -ao 'returned from EL0 (lcg slice) -- user result=0x000000000b6f2a40 (expected 0x0b6f2a40 = 191834688) PASS' arm64_boot.log | wc -l)" -eq 2 ] || {
            echo "FAILED: expected exactly TWO LCG EL0 excursions returning the per-slice tooth 0x0b6f2a40" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          # §10.202: the mem-touch DATA-page proof — the first
          # containment excursion whose result depends on the user TTBR0
          # tree's DATA page (the scratch page, baked to USER_SCRATCH_VA
          # and EL0-RW): it STOREs a 3-cell pattern, LOADs it back,
          # verifies every cell, and must return the tooth 0x0d15ea5e,
          # twice (first run MISS — EL0-only — then HIT). A faulted
          # access (unmapped user page) traps to EL1 and hangs (rc=124)
          # instead of this line.
          [ "$(grep -ao 'returned from EL0 (mem touch) -- user result=0x000000000d15ea5e (expected 0x0d15ea5e = 219540062) PASS' arm64_boot.log | wc -l)" -eq 2 ] || {
            echo "FAILED: expected exactly TWO mem-touch EL0 excursions returning the DATA-page tooth 0x0d15ea5e" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          # M5.2 (plan doc §6 M5.2 / §10.194/§10.196): the GIC tick gate
          # + the Phase 9n-style contention probe. The boot log shows
          # [TICK 1..4] as an unbroken run (exactly 4), and [TICK 2] is
          # the re-arm proof — a one-shot timer delivers only [TICK 1].
          # The ordered token stream below proves the INTERLEAVE: the
          # timer is armed BEFORE the EL0 excursions, the EL0 program is
          # a 1e8-iteration loop (~8x the 100 ms period, measured
          # §10.196), so [TICK 1] fires inside EL0 #1's window, pends
          # against the EL0 SPSR's I mask, and is taken on the
          # svc-return (between the two eret lines); [TICK 2] is pended
          # through EL0 #2 the same way; [TICK 3]/[TICK 4] land during
          # idle. Zero lost ticks = the stream is exactly this, in this
          # order — a lost tick (a level-sensitive GIC line deasserted
          # before being taken) would break the sequence or hang the
          # gate. The M5.1 counts above are untouched by construction.
          [ "$(grep -ao '\[TICK [0-9]' arm64_boot.log | wc -l)" -eq 6 ] || {
            echo "FAILED: expected exactly SIX tick lines ([TICK 1..6], unbroken run)" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          grep -a '\[TICK 2\]' arm64_boot.log || {
            echo "FAILED: [TICK 2] not seen — the timer re-armed (a one-shot delivers only [TICK 1])" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          # M5.3 (plan doc §10.197): the NESTED-IRQ probe. After the
          # M5.2 gate, the next physical tick ([TICK 5]) opens a bounded
          # unmasked window inside ITS OWN handler with the virtual
          # timer (CNTV, a DIFFERENT GIC INTID at higher priority —
          # same-PPI nesting is impossible, GICv2 running-priority, and
          # the spike proved qemu's lax same-PPI re-entry corrupts the
          # GIC) armed for 10 ms; [TICK 6] preempts the physical
          # handler mid-window, proving the EL1h IRQ entry's
          # ELR_EL1/SPSR_EL1 save/restore (a nested fire overwrites
          # both with the spin's PC; without the save/restore the outer
          # eret returns to the stale spin and loops). The ordered
          # stream asserts the whole M5.2 interleave + the nesting
          # phase, in this exact order.
          seq=$(grep -aoE '\[M5\] eret into EL0\.\.\.|\[TICK [0-9]*\]|tick gate reached|nesting window|nested: virtual timer preempted' arm64_boot.log)
          # §10.201/§10.202: the four LEADING erets are the LCG pair
          # then the mem pair — they run before the timer arms (the
          # M5.2 probe is armed by the mem continuation's handoff), so
          # no tick can fire during them; [TICK 1]/[TICK 2] then pend
          # through the smoke windows exactly as the committed sequence
          # did.
          want=$'[M5] eret into EL0...\n[M5] eret into EL0...\n[M5] eret into EL0...\n[M5] eret into EL0...\n[M5] eret into EL0...\n[TICK 1]\n[M5] eret into EL0...\n[TICK 2]\n[TICK 3]\n[TICK 4]\ntick gate reached\n[TICK 5]\nnesting window\n[TICK 6]\nnested: virtual timer preempted\ntick gate reached'
          [ "$seq" = "$want" ] || {
            echo "FAILED: the tick stream does not interleave with the EL0 excursions and the M5.3 nested phase (a tick was lost, duplicated, or taken out of order)" >&2
            echo "--- got:" >&2
            echo "$seq" >&2
            echo "--- want:" >&2
            echo "$want" >&2
            tail -30 arm64_boot.log >&2
            exit 1
          }
          echo "OK: M4a+M4b+M4c+M5+M5.1+M5.2+M5.3 arm64 kernel booted — banner + TTBR1 kernel + EL0 user pages + activation cache (1 MISS / 3 HITs) + contention-probe GIC ticks [TICK 1..4] interleaved with the EL0 excursions + nested virtual-timer IRQ ([TICK 5] window, [TICK 6] preempts the physical handler) + SIMI result 42 x4 + PSCI SYSTEM_OFF (rc=0)"

      - name: Teeth — the mem_touch EL0-only claim is machine-checked, not asserted (plan doc §10.203)
        run: |
          # §10.203: the stock boot asserts mem_touch returns its tooth
          # 0x0d15ea5e twice from EL0 — but the "EL0-only by
          # construction" property (its baked scratch is
          # USER_SCRATCH_VA, unmapped in TTBR1) was only CLAIMED in the
          # §10.202 design notes, never exercised. This teeth build
          # (-DARM64_TEETH_EL1_MEMTOUCH, make arm64-teeth) attempts to
          # run the fixture at EL1 with the SAME baked scratch: the
          # first STORE faults, the new EL1h sync slot (boot_arm64.S
          # arm64_sync_el1h) prints the Data Abort (EC=0x25) with
          # far=0x10005000 and halts — so qemu must HANG (rc=124 from
          # the timeout), the log must carry the [TEETH] attempt + the
          # [SYNC] lines, and must NOT carry a mem_touch result line or
          # a [TEETH] FAIL line. §10.204: the handler ALSO reports the
          # taking-EL from SPSR_EL1 M[3:0] — the teeth fault is taken
          # from EL1h (M=0x5), and an EL0-originated abort reaching
          # this backstop (M=0x0/EC=0x24, the future path) would print
          # "taken from EL0t" instead, which the greps below reject. If
          # the fault does not fire, the kernel prints [TEETH] FAIL and
          # the grep below fails; if it faults at the wrong VA, class,
          # or taking-EL, the [SYNC] line changes and the greps fail;
          # if it completes, rc is 0 and the boot check fails. The
          # teeth ELF is censused like the stock one (same sources +
          # one -D — the M5 FP/SIMD zero-claim holds).
          make arm64-teeth
          bash tools/simi/tests/arm64_fp_census.sh sls_arm64_kernel_teeth.elf || {
            echo "FAILED: the teeth ELF contains FP/SIMD instructions (the census above prints them)" >&2
            exit 1
          }
          if timeout 30 qemu-system-aarch64 -M virt,virtualization=on \
             -cpu cortex-a53 -m 1G -kernel sls_arm64_kernel_teeth.elf \
             -nographic -serial file:arm64_teeth.log -no-reboot; then
            echo "FAILED: the teeth boot EXITED (rc=0) — mem_touch must fault and HANG at EL1, not complete" >&2
            tail -30 arm64_teeth.log >&2
            exit 1
          else
            rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "OK: qemu timed out (rc=124) — the mem_touch EL1 attempt hung, as the EL0-only claim requires"
            else
              echo "FAILED: the teeth boot exited early (rc=$rc) — expected the timeout hang (rc=124)" >&2
              tail -30 arm64_teeth.log >&2
              exit 1
            fi
          fi
          grep -a "AeroSLS ARM64 Node Kernel Online!" arm64_teeth.log || {
            echo "FAILED: teeth boot banner not seen" >&2
            tail -30 arm64_teeth.log >&2
            exit 1
          }
          grep -a "\[TEETH\] attempting mem_touch at EL1 (baked scratch=USER_SCRATCH_VA 0x10005000" arm64_teeth.log || {
            echo "FAILED: the teeth attempt line not seen — the variant did not run" >&2
            tail -30 arm64_teeth.log >&2
            exit 1
          }
          grep -a "\[SYNC\] EL1h synchronous exception" arm64_teeth.log || {
            echo "FAILED: no EL1h synchronous exception — mem_touch did not fault at EL1 (the EL0-only claim is false, or the fault path is broken)" >&2
            tail -30 arm64_teeth.log >&2
            exit 1
          }
          # print_u64 pads to 16 hex digits, so the EC asserts use the
          # padded form (ec=0x0000000000000025) — the unpadded "ec=0x25"
          # grep silently never matched (§10.204).
          grep -a "ec=0x0000000000000025" arm64_teeth.log || {
            echo "FAILED: the fault was not a Data Abort from current EL (EC=0x25)" >&2
            tail -30 arm64_teeth.log >&2
            exit 1
          }
          grep -a "far=0x0000000010005000" arm64_teeth.log || {
            echo "FAILED: the faulting VA was not the baked USER_SCRATCH_VA 0x10005000" >&2
            tail -30 arm64_teeth.log >&2
            exit 1
          }
          # §10.204: the handler reports the ACTUAL taking-EL from SPSR_EL1's
          # M[3:0] (not the slot). The teeth fault is taken from EL1h
          # (M=0x5): assert the report names EL1h AND that it does NOT name
          # EL0t — an EL0-originated abort (M=0x0, EC=0x24) reaching this
          # backstop would print "taken from EL0t" and must fail the teeth.
          grep -a -e "-- taken from EL1h (M=0x5, current EL, SP_EL1)" arm64_teeth.log || {
            echo "FAILED: the sync handler did not report the taking-EL as EL1h from SPSR" >&2
            tail -30 arm64_teeth.log >&2
            exit 1
          }
          grep -aq "taken from EL0t" arm64_teeth.log && {
            echo "FAILED: the sync handler reported an EL0-originated abort — the teeth fault must be taken from EL1h" >&2
            tail -30 arm64_teeth.log >&2
            exit 1
          }
          grep -a "Data Abort from EL1h (current EL, SPSR M=0x5)" arm64_teeth.log || {
            echo "FAILED: the sync handler did not identify the Data Abort with its SPSR taking-EL" >&2
            tail -30 arm64_teeth.log >&2
            exit 1
          }
          grep -a "unhandled -- halting" arm64_teeth.log || {
            echo "FAILED: the sync handler did not halt after the fault" >&2
            tail -30 arm64_teeth.log >&2
            exit 1
          }
          grep -aq "\[TEETH\] FAIL" arm64_teeth.log && {
            echo "FAILED: [TEETH] FAIL present — the attempt completed or errored instead of faulting" >&2
            tail -30 arm64_teeth.log >&2
            exit 1
          }
          grep -aq "mem touch) -- user result" arm64_teeth.log && {
            echo "FAILED: a mem_touch result line is present — the EL1 run must NEVER complete" >&2
            tail -30 arm64_teeth.log >&2
            exit 1
          }
          echo "OK: teeth — mem_touch at EL1 faulted (EC=0x25 Data Abort taken from EL1h, SPSR M=0x5, far=0x10005000) and hung (rc=124): the EL0-only-by-construction claim is machine-checked, and the backstop reports the taking-EL honestly"

      - name: Kernel copy compiles under aarch64 freestanding flags (M2 gate)
        run: |
          # The kernel half of M3 (plan doc §6): kernel/simi_arm.c is a
          # byte-identical copy of tools/simi/simi_arm.c below its header
          # (re-diffed at commit time); no arm64 kernel build exists to
          # link it, so this freestanding compile under the kernel's flag
          # discipline (-ffreestanding -O2 -Wall -Wextra, the M2 gate's
          # exact shape) is what keeps the copy honest in CI. Two checks:
          # (a) zero warnings; (b) no undefined symbols beyond the
          # freestanding {memcpy, memset} pair — GCC 13 on AArch64
          # synthesizes exactly those two from the M2 chain struct copies
          # (the RV64/x86 kernel copies compile to zero undefined symbols
          # on their toolchains), so the no-libc contract is "nothing but
          # the freestanding pair", and ANY other symbol (printf, malloc,
          # ...) fails the gate. A divergence from the host copy surfaces
          # as a behavior difference under the real-A64 leg above.
          out=$(aarch64-linux-gnu-gcc -ffreestanding -O2 -Wall -Wextra \
                -ffunction-sections -fdata-sections -c kernel/simi_arm.c -o /tmp/kernel_simi_arm.o 2>&1)
          echo "$out"
          [ -z "$out" ] || {
            echo "FAILED: kernel/simi_arm.c does not compile clean under freestanding flags" >&2
            exit 1
          }
          # `|| true` on the pipeline: grep -vx exits 1 when it selects
          # nothing -- the PASS case here (no bad symbols) -- and under
          # the default bash -e shell that aborted the step with a
          # silent exit 1 before the check below could pass. The
          # [ -z "$bad" ] test owns the verdict.
          bad=$(aarch64-linux-gnu-nm -u /tmp/kernel_simi_arm.o | awk '$1 == "U" { print $2 }' \
                | grep -vx 'memcpy\|memset' || true)
          [ -z "$bad" ] || {
            echo "FAILED: kernel/simi_arm.o has libc references beyond {memcpy, memset}:" >&2
            echo "$bad" >&2
            exit 1
          }

      - name: Teeth — kernel-copy gate smokes (broken copies must fail)
        run: |
          # The gate above proves the copy is clean; this proves the gate
          # has teeth. tools/simi/tests/arm64_kernel_copy_smoke.sh
          # deliberately injects a libc call (printf) and an unused
          # variable into throwaway copies and asserts the SAME checks
          # fail, plus asserts the clean copy still passes (so the teeth
          # are meaningful). A gate that has gone blind fails here.
          out=$(bash tools/simi/tests/arm64_kernel_copy_smoke.sh 2>&1)
          echo "$out"
          echo "$out" | grep -q "3 passed, 0 failed" || {
            echo "FAILED: kernel-copy gate teeth — a deliberate violation slipped through" >&2
            exit 1
          }

      - name: Teeth — FP/SIMD census + trap smokes (a SIMD violation must fail)
        run: |
          # The census gate proves the ELF is clean; this proves the gate
          # has teeth. tools/simi/tests/arm64_fp_gate_smoke.sh injects a
          # real fmov into kernel_arm64.c, rebuilds, and asserts (a) the
          # census FAILS on the broken ELF and (b) booting the broken
          # kernel TRAPS on the SIMD access — the CPACR_EL1.FPEN=0
          # backstop: the probe's "before" line prints, the "after" never
          # does, rc=124 — then restores the tree. A gate that has gone
          # blind fails here.
          out=$(bash tools/simi/tests/arm64_fp_gate_smoke.sh 2>&1)
          echo "$out"
          echo "$out" | grep -q "4 passed, 0 failed" || {
            echo "FAILED: FP/SIMD gate teeth — a deliberate SIMD violation slipped through" >&2
            exit 1
          }
