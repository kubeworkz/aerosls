# .github/workflows/nightly-flake.yml — nightly sampling of the Phase 5
# boot-flake surface.
#
# ─── Why this exists ───────────────────────────────────────────────────────
# The push CI runs tests/phase5_boot_flake_guard.sh on every push, but the
# flake family it guards (edge-triggered serial-IRQ delivery under
# -accel tcg,thread=multi; respawn handshakes) is timing-dependent and the
# repo gets stretches with no pushes. A scheduled run samples the same
# surface daily so a regression that only shows up ~1-in-N boots is seen
# within a day instead of whenever the next push happens to land.
#
# It deliberately does NOT rerun the rest of the push CI: the host suite,
# guard smokes, and /api/health boot already run per push. This workflow
# only rebuilds the shipping ISO (same commands as the push CI's boot job:
# make X86_CC=gcc X86_LD=ld x86-iso with the ../qemu sibling) and runs the
# 6-boot guard. Boots that reach both markers are killed early (~22s each),
# so a clean night costs ~3 minutes of runner time; a failing night costs
# up to 12 minutes and fails the workflow with the failing boot's serial
# lines in the log.
#
# Runs on the self-hosted WSL runner (same routing exception as ci.yml —
# tests/selfhosted_routing_smoke.sh only locks ci.yml's own runs-on lines,
# so this file does not participate in that two-way lock).
#
# Triggers: daily 04:17 UTC (off-peak, off-the-hour) + manual dispatch.
name: Nightly flake guard

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  flake-guard:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: aerosls2

      - name: Guard the qemu-sls checkout (private repo requires QEMU_SLS_PAT)
        env:
          QEMU_SLS_PAT: ${{ secrets.QEMU_SLS_PAT }}
        run: |
          set -u
          # Probe helper: echo the HTTP code for a URL, with the PAT as a
          # Bearer when one is set. `|| echo 000` keeps a curl failure
          # (network, DNS, TLS) from aborting under bash -e with zero
          # output; 000 means "no response" and every caller checks for it.
          probe() {
            if [ -n "$2" ]; then
              curl -sL --max-time 15 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $2" "$1" || echo 000
            else
              curl -sL --max-time 15 -o /dev/null -w '%{http_code}' "$1" || echo 000
            fi
          }
          if [ -n "${QEMU_SLS_PAT:-}" ]; then
            # Secret set: validate it actually covers the repo BEFORE the
            # checkout, so a mis-configured token fails here with the
            # cause instead of burning retries on a raw git 403. Probe 1
            # = repo metadata (GET /repos/...): needs only Metadata: Read
            # on the repo. Probe 2 = the root contents listing (GET
            # /repos/.../contents/): needs Contents: Read -- the
            # permission git smart-HTTP actually uses. The failure modes
            # map one-to-one:
            #   401          -> the secret holds an invalid/expired token
            #                  (stale or truncated value -- re-paste the
            #                  current token from the PAT edit page)
            #   403/404 on 1 -> token authenticates but is not granted
            #                  this repo (wrong repo selected, wrong
            #                  owner account, or the org never approved
            #                  the fine-grained token)
            #   200 then 403 -> metadata-only token: Contents: Read
            #                  missing. Invisible to the anonymous probe
            #                  and to the API repo endpoint (curl says
            #                  200, git says 403) -- the exact failure
            #                  that took three CI cycles to find.
            meta=$(probe https://api.github.com/repos/kubeworkz/qemu-sls "$QEMU_SLS_PAT")
            case "$meta" in
              000*)
                echo "::error::could not reach api.github.com to validate QEMU_SLS_PAT (HTTP $meta) --"
                echo "::error::retry the run; CI cannot verify the checkout without the probe."
                exit 1 ;;
              200) ;;
              401)
                echo "::error::QEMU_SLS_PAT is set but GitHub rejects it as a credential (HTTP 401) --"
                echo "::error::the secret likely holds a stale, truncated, or revoked token value;"
                echo "::error::copy the current token from the fine-grained PAT edit page and re-save"
                echo "::error::the QEMU_SLS_PAT secret with it."
                exit 1 ;;
              403|404)
                echo "::error::QEMU_SLS_PAT is set but GitHub denies it on kubeworkz/qemu-sls (HTTP $meta)."
                echo "::error::The token authenticates but is not granted this repository -- on the"
                echo "::error::fine-grained PAT's edit page check that Repository access includes"
                echo "::error::kubeworkz/qemu-sls, that the token was created in the account that"
                echo "::error::owns/admins the repo, and that any required org approval was granted."
                exit 1 ;;
              *)
                echo "::error::unexpected HTTP $meta probing kubeworkz/qemu-sls with QEMU_SLS_PAT -- retry the run."
                exit 1 ;;
            esac
            contents=$(probe "https://api.github.com/repos/kubeworkz/qemu-sls/contents/" "$QEMU_SLS_PAT")
            case "$contents" in
              200)
                echo "QEMU_SLS_PAT validated on kubeworkz/qemu-sls (metadata + contents read) -- proceeding to the checkout."
                exit 0 ;;
              000*)
                echo "::error::could not reach api.github.com validating QEMU_SLS_PAT contents access (HTTP $contents) -- retry the run."
                exit 1 ;;
              403|404)
                echo "::error::QEMU_SLS_PAT can read the repo's metadata but NOT its contents (HTTP $contents)."
                echo "::error::git clone/fetch needs Contents: Read, not just Metadata. On the fine-grained"
                echo "::error::PAT's edit page for kubeworkz/qemu-sls set Permissions -> Repository"
                echo "::error::permissions -> Contents: Read-only (Metadata: Read is auto-granted)."
                exit 1 ;;
              *)
                echo "::error::unexpected HTTP $contents probing qemu-sls contents with QEMU_SLS_PAT -- retry the run."
                exit 1 ;;
            esac
          fi
          # No secret set: probe the repo anonymously -- a 200 means it
          # went public (no secret needed, checkout works anonymously),
          # anything else means the checkout would fail, so name the fix
          # and stop. -L: the API answers 301 (moved to a repository-ID
          # URL) for public repos; without following it a public repo
          # would be misread as private and the guard would fail wrongly.
          code=$(probe https://api.github.com/repos/kubeworkz/qemu-sls "")
          if [ "$code" = "200" ]; then
            echo "qemu-sls is public -- no secret needed, checkout will work anonymously."
            exit 0
          fi
          # curl writes the -w code once per connection attempt, so a
          # failed probe can be "000" or "000000" -- match the all-zeros
          # family rather than an exact "000".
          case "$code" in
            000*)
              echo "::error::could not reach api.github.com to probe qemu-sls visibility (HTTP $code) --"
              echo "::error::retry the run; CI cannot verify the checkout without the probe."
              exit 1 ;;
          esac
          echo "::error::qemu-sls (kubeworkz/qemu-sls) is PRIVATE but the QEMU_SLS_PAT"
          echo "::error::secret is not configured (anonymous probe returned HTTP $code)."
          echo "::error::The kernel links objects out of ../qemu, so CI cannot build without"
          echo "::error::this checkout. Fix: add a read-access"
          echo "::error::fine-grained PAT for kubeworkz/qemu-sls as the QEMU_SLS_PAT secret at"
          echo "::error::https://github.com/kubeworkz/aerosls/settings/secrets/actions"
          exit 1

      - uses: actions/checkout@v4
        with:
          repository: kubeworkz/qemu-sls
          path: qemu
          token: ${{ secrets.QEMU_SLS_PAT }}
          fetch-depth: 1

      - name: Kernel build tools (nasm, grub, qemu)
        run: sudo apt-get update && sudo apt-get install -y nasm grub-pc-bin mtools xorriso qemu-system-x86

      - name: Build the kernel ISO (host gcc/ld as the toolchain)
        run: make X86_CC=gcc X86_LD=ld x86-iso
        working-directory: aerosls2

      - name: Run the 6-boot flake guard (tcg,thread=multi)
        run: bash tests/phase5_boot_flake_guard.sh
        working-directory: aerosls2
