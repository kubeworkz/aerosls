set timeout=3
set default=2

# Serial console: QEMU -nographic maps -serial to the first serial port.
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

# Load graphics/font support for both BIOS and UEFI consoles
if loadfont /boot/grub/fonts/unicode.pf2; then
    insmod gfxterm
    set gfxmode=auto
    terminal_output serial console
fi

menuentry "AeroSLS — Single Level Storage OS" {
    insmod multiboot2
    multiboot2 /boot/my_sls_kernel.bin
    boot
}

menuentry "AeroSLS (serial debug)" {
    insmod multiboot2
    multiboot2 /boot/my_sls_kernel.bin
    boot
}

# ─── Phase 5 self-hosted boot ────────────────────────────────────────────────
# Loads the sidecars initrd (sidecars.cpio, built by `make
# selfhost-bootimage` and shipped into the ISO by `make x86-iso`) as a
# Multiboot2 module. The kernel's launch_init_sidecar (kernel/boot_image.c,
# kernel_main step 7d) scans the module list, walks the newc archive,
# copies init.bin/dm.bin to their manifest-declared addresses, builds the
# device registry, and creates the init sidecar — look for the
# "[SIDECAR] init sidecar created" line in the serial log, then the init
# sidecar's own "[INIT] ..." console-channel output. Without the module
# present this entry is identical to the entries above (the kernel falls
# through to the HTTP/shell boot).
menuentry "AeroSLS — Phase 5 self-hosted (initrd sidecars)" {
    insmod multiboot2
    multiboot2 /boot/my_sls_kernel.bin
    module2 /boot/sidecars.cpio
    boot
}

# ─── Cluster nodes ──────────────────────────────────────────────────────
# A node can be given its cluster identity here instead of by typing
# `cluster init <n>` at the shell -- which is not merely convenient but
# necessary, because kernel.c enters http_server_run() and never returns
# when a NIC is present, so a networked node never reaches a shell prompt
# at all. See kernel/boot_params.h.
#
#   multiboot2 /boot/my_sls_kernel.bin node=1
#
# A node with two NICs also names their roles, or the kernel falls back to
# enumeration order (first card management, second cluster):
#
#   multiboot2 /boot/my_sls_kernel.bin node=1 nic0=mgmt nic1=cluster
#
# Roles are mgmt | cluster | both | none. A name that is not one of those
# leaves that interface with NO role and logs -- a typo must not resolve to
# a plausible default and put DSPP on the management wire. Naming ANY
# interface switches the whole assignment to the command line, so an
# unnamed card gets nothing rather than quietly inheriting the convention.
#
# Valid ids are 1..CLUSTER_NODE_MAX (8). An out-of-range or malformed value
# leaves the node STANDALONE and logs an error -- it is deliberately not
# clamped, because two nodes silently sharing an id is worse than one node
# visibly not joining.
#
# One ISO can only say one thing, so each node needs boot media carrying
# its own `node=`. The N-node launcher generates them per node; see
# docs/AeroSLS-N-Node-Launcher-Plan-v0.1.md.
#
# menuentry "AeroSLS — cluster node 1" {
#     insmod multiboot2
#     multiboot2 /boot/my_sls_kernel.bin node=1
#     boot
# }
