set timeout=3
set default=0

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

if loadfont /boot/grub/fonts/unicode.pf2; then
    insmod gfxterm
    set gfxmode=auto
    terminal_output serial console
fi

menuentry "AeroSLS — Phase 5 self-hosted (initrd sidecars)" {
    insmod multiboot
    # NIC roles, read by kernel/kernel.c step 7 (e1000_assign_roles):
    #   nic0=both   — first e1000 (lowest PCI slot) carries the kernel's
    #                 mgmt + cluster traffic, exactly like today's
    #                 single-NIC boots (one card holds both roles).
    #   nic1=none   — a SECOND e1000 (when one is attached) is reserved for
    #                 the user driver sidecar drv.e1000.0: the kernel hands
    #                 it over (e1000_driver_handoff: bus master + uncached
    #                 BAR, nothing else) instead of programming its rings.
    # Single-NIC boots ignore nic1= entirely; nic0=both is their existing
    # implicit role, so every current boot is unchanged.
    multiboot /boot/my_sls_kernel.bin nic0=both nic1=none
    module /boot/sidecars.cpio sidecars.cpio
    boot
}

menuentry "AeroSLS — kernel only" {
    insmod multiboot
    multiboot /boot/my_sls_kernel.bin
    boot
}

menuentry "GRUB shell" {
    commandline
}
