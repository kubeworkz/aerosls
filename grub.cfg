set timeout=3
set default=2

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

if loadfont /boot/grub/fonts/unicode.pf2; then
    insmod gfxterm
    set gfxmode=auto
    terminal_output serial console
fi

menuentry "AeroSLS — Single Level Storage OS" {
    insmod multiboot2
    multiboot2 /boot/my_sls_kernel.bin
    boot
}

menuentry "AeroSLS (serial debug)" {
    insmod multiboot2
    multiboot2 /boot/my_sls_kernel.bin
    boot
}

menuentry "AeroSLS — Phase 5 self-hosted (initrd sidecars)" {
    insmod multiboot2
    multiboot2 /boot/my_sls_kernel.bin
    module2 /boot/sidecars.cpio sidecars.cpio
    boot
}
