set timeout=3
set default=2

menuentry "AeroSLS — Single Level Storage OS" {
    insmod multiboot2
    multiboot2 /boot/my_sls_kernel.bin
    boot
}

menuentry "AeroSLS (serial debug)" {
    insmod multiboot2
    multiboot2 /boot/my_sls_kernel.bin
    boot
}

menuentry "AeroSLS — Phase 5 self-hosted (initrd sidecars)" {
    insmod multiboot
    insmod multiboot2
    multiboot /boot/my_sls_kernel.bin
    module /boot/sidecars.cpio sidecars.cpio
    boot
}
