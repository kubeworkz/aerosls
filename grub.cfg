set timeout=3
set default=0

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

if loadfont /boot/grub/fonts/unicode.pf2; then
    insmod gfxterm
    set gfxmode=auto
    terminal_output serial console
fi

menuentry "AeroSLS — Phase 5 self-hosted (initrd sidecars)" {
    insmod multiboot
    # NIC roles, read by kernel/kernel.c step 7 (e1000_assign_roles):
    #   nic0=both   — first e1000 (lowest PCI slot) carries the kernel's
    #                 mgmt + cluster traffic, exactly like today's
    #                 single-NIC boots (one card holds both roles).
    #   nic1=none   — a SECOND e1000 (when one is attached) is reserved for
    #                 the user driver sidecar drv.e1000.0: the kernel hands
    #                 it over (e1000_driver_handoff: bus master + uncached
    #                 BAR, nothing else) instead of programming its rings.
    # Single-NIC boots ignore nic1= entirely; nic0=both is their existing
    # implicit role, so every current boot is unchanged.
    multiboot /boot/my_sls_kernel.bin nic0=both nic1=none
    module /boot/sidecars.cpio sidecars.cpio
    boot
}

menuentry "AeroSLS — kernel only" {
    insmod multiboot
    multiboot /boot/my_sls_kernel.bin
    boot
}

# POSIX-Environments E1 — the UNIFIED boot. Same initrd as entry 0, but
# `unified=1` selects the third boot mode instead of the Phase-5 one: the
# kernel creates the init sidecar and RETURNS (leaving it runnable) so boot
# continues into the Ring-0 control plane — the HTTP server on the management
# NIC — which then shares the CPU with the sidecar world through the
# cooperative yield (kernel_yield_to_ring3). The NIC roles are the same as
# entry 0's: the kernel keeps both (mgmt for HTTP, cluster for DSPP).
#
# Deliberately the LAST entry: tests/grub_select_kernel_only.sh selects entry
# 1 by sending one Down to grub's serial menu, and every existing boot guard
# depends on entry 0 being the Phase-5 boot and entry 1 the kernel-only one.
# Appending here leaves both indices exactly where they were.
menuentry "AeroSLS — unified (control plane + sidecars)" {
    insmod multiboot
    multiboot /boot/my_sls_kernel.bin unified=1 nic0=both nic1=none
    module /boot/sidecars.cpio sidecars.cpio
    boot
}

menuentry "GRUB shell" {
    commandline
}
