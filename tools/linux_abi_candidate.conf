# tools/linux_abi_candidate.conf — the E7 census target, designated by hand.
#
# E7's syscall table is built from `strace` on ONE real binary
# (docs/AeroSLS-Linux-ABI-Shim-Design-v0.1.md §5.5), so this file is the
# difference between a measurement and a guess. It shipped UNDESIGNATED on
# purpose: there was no first user to discover. The project has since designated
# the backup operation (see the bottom of this file), so the designation below
# records a decision that was made rather than one this file presumes.
#
# ─── Why there is nothing to discover ──────────────────────────────────────
# AeroSLS-Roadmap-2026H2-v0.1.md §5, in bold: "There is no named first user."
# It calls that the single largest risk in the roadmap and says the shortlist
# question — "which language, which syscalls, which binary" — is unanswerable
# without one, because "strace on their actual workload is the specification".
# §5 and §7 then give the answer the project can act on: dogfood it — move one
# of Gridworkz's own operations onto AeroSLS, and "the first user exists on day
# one and is you."
#
# So the census target is a DECISION. Verified against the tree, none of the
# binary candidates exists yet: there is no Go source anywhere in the repo, no
# std-Rust binary, and every real operational workload is bash or python —
# backup/backup.sh, backup/restore.sh, monitor/health_check.sh,
# deploy/deploy.sh, utils/*.py. The only static ELFs in the tree are the kernel
# images themselves (my_sls_kernel.bin, sls_arm64_kernel.elf), which are not
# Linux-ABI candidates at all.
#
# ─── The four operations H2 §7 names, evaluated against E7's own constraints ─
#
#   logs     — docs/AeroSLS-Operational-MVP-Roadmap-v0.1.md §"Log rotation"
#              makes log rotation pm2-logrotate plus a logrotate template, i.e.
#              configuration of existing tools. There is no workload to write
#              and therefore nothing to census. Not a candidate.
#
#   billing  — the only billing in the tree is SlsUserPortal.tsx, which
#              docs/AeroSLS-Navigator-Parity-Gap-Roadmap-v0.1.md §118 calls "a
#              complete, self-aware fictional SaaS billing" demo, and usage
#              metering already exists in-kernel (kernel/usage_metering.c). A
#              fictional TSX web app is neither real nor a static binary. Not a
#              candidate.
#
#   monitoring — monitor/health_check.sh is real and runs every two minutes
#              against https://aerosls.kubeworkz.io/api/health. Eliminated by
#              the shim's own scope, and this elimination is the useful part:
#              it needs outbound TCP/TLS and a webhook POST, i.e. socket/
#              connect/sendto, which the design and POSIX-Environments v0.2 §12
#              item 2 place AFTER E7. A census target must be reachable with the
#              v1 core.
#
#   backup   — backup/backup.sh (Operational-MVP Phase D) is real, hourly and
#              daily via cron, and its core loop is pure local file I/O: copy
#              the storage image, then prune to a retention count. No sockets,
#              nothing inherently threaded, and its work is verifiable (a
#              snapshot appears and the retention count holds). It exercises
#              exactly the design's §5.6 core — openat/read/write/fstat/rename/
#              unlink/getdents64/fsync, plus getrandom for integrity — and it is
#              the one named operation that can be FINISHED inside a static
#              single-threaded binary on that core.
#
# ─── DESIGNATED: the backup operation ─────────────────────────────────────
# A static, single-threaded Rust rewrite of backup/backup.sh's snapshot-and-
# retain core, built for x86_64-unknown-linux-musl (non-PIE), with the pm2
# stop/start and health-poll orchestration left OUT — those are host
# orchestration, not the workload, and the health poll is the networking that
# eliminated the monitoring candidate.
#
# CENSUSED AND PROVED. tools/linux_syscall_census.txt is the measurement: 26
# syscalls from a strace of the static musl build, plus the vDSO-backed set the
# trace structurally cannot see (CANDIDATE_VDSO_SYSCALLS below). `--check`
# re-verifies the artifact against the binary's sha256 and exits 0.
#
# The declared set is not left as an inference: tools/linux_syscall_census_novdso.txt
# is the PROOF, and `--check` refuses a declaration that has none beside it. It is
# a second strace run of the same candidate started by tools/e7_stack_launcher.c,
# which builds the initial stack itself and leaves AT_SYSINFO_EHDR out of the auxv,
# so the host stops behaving like a host with a vDSO. The declared clock_gettime
# shows up there as a real syscall 228 — and nothing else in the row set changes.
#
# The first real run earned its keep by refusing twice, and both refusals are
# recorded here rather than smoothed over:
#   1. the musl target produced ET_DYN (static-PIE) by DEFAULT, so §5.1's image
#      contract rejected it. The design's v0.1 claim that this target builds
#      non-PIE was wrong; backup/aerobackup/.cargo/config.toml is the fix.
#   2. the trace contained no clock syscall although the binary demonstrably read
#      the clock (its output filename is a timestamp), which is the vDSO gap that
#      CANDIDATE_VDSO_SYSCALLS exists to record.

CANDIDATE_STATE=designated

CANDIDATE_NAME=aerobackup

# The real, EXISTING operation this binary is a rewrite of. This field is the
# whole anti-placeholder mechanism: linux_syscall_census.sh refuses to run if it
# is empty or does not name a path that exists, so a toy cannot be censused by
# accident.
CANDIDATE_PROVENANCE=backup/backup.sh

# The built binary, repo-relative.
CANDIDATE_BIN=backup/aerobackup/target/x86_64-unknown-linux-musl/release/aerobackup

# Its rust target triple (or Go's GOOS/GOARCH equivalent), recorded in the
# artifact because the shim's number table is per-architecture.
CANDIDATE_TARGET=x86_64-unknown-linux-musl

# The build command, run from the repo root. Must produce a non-PIE, statically
# linked ET_EXEC; linux_syscall_census.sh enforces that on the built file and
# refuses to census anything else (§5.1).
#
# Values may contain spaces unquoted: this file is PARSED, not sourced, so a
# space is a space rather than the start of a command.
# NOTE the `cd`: cargo reads .cargo/config.toml relative to the current directory,
# not the manifest, and this crate's config is what pins non-PIE codegen. The
# naked `--manifest-path` form from the repo root silently produces a static-PIE
# image that §5.1 refuses — measured: that is how the first census run failed.
CANDIDATE_BUILD=cd backup/aerobackup && cargo build --release --target x86_64-unknown-linux-musl

# HOW THE WORKLOAD'S INPUTS ARE MADE, run from the repo root before the trace.
# Declared rather than fabricated by the tool: a census harness that invented
# its own input file would be measuring its scaffolding instead of the user's
# work. This builds a 64 MiB image that is 6 MiB dense and the rest hole — the
# shape `sls_storage.img` actually has, since the kernel writes blocks and never
# the whole file — plus six existing hourly backups so the retention prune has
# something to delete. That makes the trace representative of the real cron run:
# reads, sparse detection, writes, fsync, rename, getdents64 and unlink all
# appear, rather than only the reads a fully-sparse file would produce.
#
# The `rm -rf` is load-bearing and was not there at first. Without it the setup
# only ADDED six backups to whatever the previous run had left behind — and the
# backup workload's whole tail (how many entries are lstat'd, how many are
# pruned, how many lines are printed) depends on how many files are already in
# the directory. So a second `--run` measured a different workload from the
# first and produced a different histogram from the same binary: the checked-in
# artifact recorded `lstat 8 / unlink 4 / write 103` while a clean fixture gives
# `lstat 7 / unlink 3 / write 102`. It was the vDSO proof (§5.5) that found it,
# because a proof compares two row sets and cannot do that if the fixture the
# two runs see is not the same. A setup that depends on leftovers is not a setup.
CANDIDATE_SETUP=rm -rf /tmp/e7-census/backups && mkdir -p /tmp/e7-census/backups/hourly && truncate -s 64M /tmp/e7-census/sls_storage.img && dd if=/dev/urandom of=/tmp/e7-census/sls_storage.img bs=1M count=4 conv=notrunc status=none && dd if=/dev/urandom of=/tmp/e7-census/sls_storage.img bs=1M count=2 seek=32 conv=notrunc status=none && for i in 1 2 3 4 5 6; do touch -d "2026-01-0$i 00:00:00" "/tmp/e7-census/backups/hourly/sls_storage-2026010$i-000000.img"; done

# The real invocation. `--run` REFUSES an empty value: tracing `<binary>` with
# no arguments traces a usage message, which is the placeholder failure in a
# different shape. `--retain 4` is the hourly tier's own default, written out so
# the artifact records the retention the trace was taken under rather than one
# the reader has to look up.
CANDIDATE_ARGS=--storage /tmp/e7-census/sls_storage.img --backup-dir /tmp/e7-census/backups --kind hourly --retain 4

# SYSCALLS THIS MEASUREMENT CANNOT SEE, because the host it runs on HAS a vDSO and
# the shim deliberately does not (design §5.2 omits AT_SYSINFO_EHDR). musl resolves
# these in userspace here and will trap on AeroSLS, so they are requirements the
# trace is structurally incapable of revealing — and a missing requirement looks
# exactly like a requirement nobody needed, which is why the key must be set and
# 'none' is a distinct, explicit answer.
#
# clock_gettime — evidenced, not assumed: the binary's own output filename is a
# clock reading (sls_storage-20260928-234732.img), and the trace contains no clock
# syscall at all, so the read happened in userspace. Corroborating detail from the
# same strace: arch_prctl(ARCH_SET_FS, 0x47a1a8) IS present (the TLS call design
# §5.3 predicts) and neither clock_gettime nor gettimeofday is.
#
# gettimeofday and time are NOT declared: nothing in the trace suggests the binary
# calls them, and declaring a syscall with no evidence would be inventing a
# requirement instead of measuring one.
CANDIDATE_VDSO_SYSCALLS=clock_gettime
