[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "relocation-model=static",
    # The kernel's low image (including its GDT/TSS/VGA statics around
    # 0x444000) lives in the 0x400000..0x5fffff 2 MiB chunk. A large static
    # ET_EXEC linked at 0x400000 would replace those supervisor pages with
    # its own user pages, so this candidate links at 1 GiB instead: still
    # user-canonical, still a non-PIE ET_EXEC, and above every kernel
    # identity-mapped page the switch path touches. 1 GiB (rather than a
    # higher address) also keeps the static binary within the small code
    # model's 32-bit relocation reach.
    "-C", "link-arg=-Tlinker.ld",
]
