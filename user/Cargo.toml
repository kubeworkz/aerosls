# AeroSLS sidecar workspace.
#
# Six crates:
#   proto/      shared wire-format definitions (RD_* + channel envelope) and
#               the kernel ABI (Kernel trait, cap types, error codes), no_std
#   ramdisk/    the aerosls.ramdisk.v1 driver sidecar, no_std
#   blockcache/ the POSIX sidecar's block cache (the ramdisk protocol
#               client), no_std
#   vfs/        the POSIX sidecar's VFS (aerofs-lite + ramfs mounts, fd
#               tables, the syscall surface), no_std
#   procmgr/    the POSIX sidecar's proc manager (cooperative tasks over
#               the VFS: fork/exec/exit/wait), no_std
#   sidecar/    the POSIX sidecar itself: manifest/BIB handling, the
#               bootstrap (mount + init spawn), and the entry point, no_std
#   kernel-sim/ host-only fake kernel used by the ramdisk, blockcache,
#               vfs, procmgr and sidecar integration tests
#
# The ramdisk and sidecar crates default to the *host* build (no kernel ABI)
# so they can be tested against the fake kernel in tests/. The real sidecar
# images are built with `--features target` (see user/README.md).
[workspace]
members = ["proto", "kernel-sim", "ramdisk", "blockcache", "vfs", "procmgr", "sidecar", "network", "gui"]
resolver = "2"
