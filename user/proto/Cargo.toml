[package]
name = "aerosls-proto"
version = "0.1.0"
edition = "2021"
description = "Shared AeroSLS sidecar wire-format definitions (RD_* protocol + channel envelope)"
license = "MIT"

[dependencies]
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }

# The `target` feature selects the real kernel ABI (extern "C" syscalls) and
# the sidecar entry points. The default (host) build omits them so the crate
# links cleanly into the test harness.
[features]
default = []
target = []
