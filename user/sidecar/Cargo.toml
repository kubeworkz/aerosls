[package]
name = "aerosls-sidecar"
version = "0.1.0"
edition = "2021"
description = "The AeroSLS POSIX sidecar (aerosls.posix.v1) — manifest/boot handling, entry point, and the bootstrap that mounts the ramdisk and spawns init"
license = "MIT"

[dependencies]
aerosls-proto = { path = "../proto" }
aerosls-blockcache = { path = "../blockcache" }
aerosls-vfs = { path = "../vfs" }
aerosls-procmgr = { path = "../procmgr" }

[dev-dependencies]
aerosls-kernel-sim = { path = "../kernel-sim" }
aerosls-ramdisk = { path = "../ramdisk" }

[[bin]]
name = "posix"
path = "src/bin/posix.rs"
required-features = ["target"]

[features]
default = []
# `target` enables the real kernel ABI (extern "C" syscalls), the sidecar
# entry point (rust_entry), the crt0 (crt0.S via global_asm!), and the
# panic handler. Build the sidecar image with:
#   cargo build -p aerosls-sidecar --features target \
#       --target x86_64-unknown-none --release --bin posix
target = ["aerosls-proto/target"]
# E7 §10.14's STALL DRILL — a DRILL, never a shipped profile. The gate
# profile's sidecar stretches its own boot past the pour's old fixed 30 s
# bound (kernel/env_payload.h's EP_WAIT_TICKS) so a live run can prove the
# stall-bounded wait extends instead of calling a working environment
# refused. Enabled only by `make x86-iso-e3 ... E7_SLOW_BOOT=1`; a default
# build compiles none of it (the call site is cfg'd, not runtime-branched).
e7_slow_boot = []
