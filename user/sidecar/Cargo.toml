[package]
name = "aerosls-sidecar"
version = "0.1.0"
edition = "2021"
description = "The AeroSLS POSIX sidecar (aerosls.posix.v1) — manifest/boot handling, entry point, and the bootstrap that mounts the ramdisk and spawns init"
license = "MIT"

[dependencies]
aerosls-proto = { path = "../proto" }
aerosls-blockcache = { path = "../blockcache" }
aerosls-vfs = { path = "../vfs" }
aerosls-procmgr = { path = "../procmgr" }

[dev-dependencies]
aerosls-kernel-sim = { path = "../kernel-sim" }
aerosls-ramdisk = { path = "../ramdisk" }

[[bin]]
name = "posix"
path = "src/bin/posix.rs"
required-features = ["target"]

[features]
default = []
# `target` enables the real kernel ABI (extern "C" syscalls), the sidecar
# entry point (rust_entry), the crt0 (crt0.S via global_asm!), and the
# panic handler. Build the sidecar image with:
#   cargo build -p aerosls-sidecar --features target \
#       --target x86_64-unknown-none --release --bin posix
target = ["aerosls-proto/target"]
# E7 §10.14's STALL DRILL — a DRILL, never a shipped profile. The gate
# profile's sidecar stretches its own boot past the pour's old fixed 30 s
# bound (kernel/env_payload.h's EP_WAIT_TICKS) so a live run can prove the
# stall-bounded wait extends instead of calling a working environment
# refused. Enabled only by `make x86-iso-e3 ... E7_SLOW_BOOT=1`; a default
# build compiles none of it (the call site is cfg'd, not runtime-branched).
e7_slow_boot = []
# M1's live Linux TCP probe — a build-time feature, enabled only by
# `make x86-iso-e3 ... M1_NET_PROBE=1` for the QEMU gate run. A default
# build compiles neither the module nor the spawn call.
m1_net_probe = []
# M4.2's live clone probe — a build-time feature, enabled only by
# `make x86-iso-e3 M4_THREAD_PROBE=1`. Default builds compile neither the
# module nor its spawn call.
m4_thread_probe = []
# M4.3's live shared-group probe — enabled only by `make x86-iso ...
# M4_GROUP_PROBE=1`. Default builds compile neither the module nor its
# spawn call.
m4_group_probe = []
# M4.4's live futex wait/wake probe — enabled only by `make x86-iso ...
# M4_FUTEX_PROBE=1`. Default builds compile neither the module nor its
# spawn call.
m4_futex_probe = []
# M4.5's live identity/thread-exit/exit_group probe — enabled only by
# `make x86-iso ... M4_EXIT_PROBE=1`. Default builds compile neither the
# module nor its spawn call.
m4_exit_probe = []
# M4.6 increment 1's live checkpoint probe — enabled only by
# `make x86-iso-e3 M4_CKPT_PROBE=1 E3_INIT_FEATURES=e3_envs,e7_gate,m4_ckpt_probe`.
# It replaces the gate profile's firstuser with a two-thread fixture that
# stays live while the checkpoint captures it. Default builds compile neither
# the module nor its spawn path.
m4_ckpt_probe = []
# M4.7's live runtime gate — enabled only by
# `make x86-iso-e3 M4_RUNTIME_PROBE=1 E3_INIT_FEATURES=e3_envs,e7_gate`.
# It replaces the gate profile's firstuser with the static threaded Rust
# probe. Default builds compile neither the module nor its spawn path.
m4_runtime_probe = []
# M4.8's live clone3/requeue/robust/signal gate — enabled only by
# the E3 gate profile with M4_HARDENING_PROBE=1. Default builds compile neither the
# module nor its spawn path.
m4_hardening_probe = []
